id: DEL-02-02
name: Make library and adopted-product meanings explicit
needs:
- from: doc:docs/AGENT_WORKFLOW_RUNTIME.md
  condition: Read the selected production-ownership, Root-governance, selection and retained-runtime passages
    with their introduction, historical/adoption qualifications and actual source revision before deciding
    applicability.
  when: Examining the bounded F-02 reference case
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
- from: doc:docs/PRODUCT_BOUNDARIES.md
  condition: Preserve the selected adopted-commitment, professional-accountability, invariant, domain
    and frozen-runtime meanings while examining the reference case; the opening qualifications are part
    of the evidence.
  when: Comparing authority and domain/product applicability
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
- from: doc:docs/COMPATIBILITY_FORMATS.md
  condition: Compare the selected current-locality, retained deployment/M2/G4 and legacy-format clauses
    at the actual basis. Preserve adopted containment and historical identities; do not infer a lifecycle
    migration from clarification.
  when: Distinguishing current Root setup from retained compatibility contracts
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
- from: doc:docs/thesis/04_architecture.md
  condition: Read the selected sections 4.2.1 through 4.2.3 at an identified source revision and compare
    locality, relationships and their warrant with the reference dispositions. Preserve explanatory standing
    and historical basis.
  when: Examining the connected thesis explanation
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
- from: doc:docs/alignment-manual/Project_Management_for_Human_Agent_Teams_Consolidated_v9.md
  condition: Use the named edition and selected passages in the ScopeOfWork, including the README discovery/reliance
    and render rules. Bind actual candidate/source identity; inspect an affected maintained derivative
    or justify no derivative change.
  when: Examining the connected manual explanation or changing an affected passage
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
- from: DEL-04-01
  condition: Use the existing same-PR reconciliation practice to compare source meaning and evidence and
    retain warranted changes or unresolved conditions in this locality. No whole-practice completion gate
    is implied.
  when: Carrying the bounded reference-content comparison through integration
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
- from: DEL-03-01
  condition: A claimed executable behavior or enforcement boundary is supported by the selected operation,
    candidate and observed or applicable maintained check evidence. Documentation alone cannot establish
    behavior.
  when: The clarification relies on a tool or runtime behavior claim
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
- from: DEL-05-01
  condition: Obtain the named maintained adopter contract/fixtures and exact revision, with authorized
    access and public-evidence limits, before an incompatible adopted-clause change or named compatibility
    claim. Q-04 is unresolved; preserve the scoped contract while that condition is unmet.
  when: Changing a disputed clause that an independent consumer adopted
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
- from: DEL-05-01
  condition: Bind the verified publication candidate/version, actual delivery form and prior comparison
    basis before making the distinct A7 preparation/inspection claim. Q-05 is bound for the F-02/Consolidated
    v9 source candidate at 1357d706ea77497903976bf159f3880bea4d1360 against 257ab4c18014bf872a1c72eeb7593a7ad3d135c0,
    as recorded in DEL-05-01 Work/ConsumerBasis.md. Other publication claims require their own binding;
    source-passage comparison can proceed independently.
  when: Relying on a publication-change account or asserting preparation/update-inspection evidence
  evidence: execution/PKG-02/DEL-02-02/Work/Applicability.md
code_paths:
