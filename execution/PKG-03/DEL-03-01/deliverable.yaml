id: DEL-03-01
name: Support current localities with actual reusable tools
needs:
- from: doc:execution/_Decomposition/checkpoint_snapshots/GROUP3-20261101T011431Z/PROJECT_DECOMP.md
  condition: Use the accepted identities, current locality convention and actual setup authority with
    inspected target contents before live creation. Sections 8.1 and 6.1 distinguish formation scope from
    already repaired tooling.
  when: Selecting or exercising a live formation operation
  evidence: execution/PKG-03/DEL-03-01/Work/ToolBasis.md
- from: doc:workflows/project-setup/resources/current-project.md
  condition: 'Use the explicit current route and corresponding helper/preparation/ScopeOfWork instructions
    at the selected revision; compare actual source/caller behavior with PR #1779 evidence for the particular
    unchanged claim.'
  when: Reusing or examining setup support
  evidence: execution/PKG-03/DEL-03-01/Work/ToolBasis.md
- from: DEL-04-01
  condition: The selected live consumer declarations and owning ScopeOfWork/Work exist with actual intended-use
    conditions, known project root and Git/HEAD basis. Empty declarations or path presence do not establish
    meaningful query inputs or suitability. Read only the authorized query scope.
  when: Exercising native queries on the formed Root localities
  evidence: execution/PKG-03/DEL-03-01/Work/ToolBasis.md
- from: unknown
  condition: Identify the actual affected caller contract, intended use, source revision and maintained
    fixtures before changing a selected utility or exported interface. The caller set is case-specific;
    unknown callers are not assumed absent and do not justify a census.
  when: A concrete utility or exported-interface change is proposed
  evidence: execution/PKG-03/DEL-03-01/Work/ToolBasis.md
- from: DEL-05-01
  condition: Bind the named maintained consumer contract/fixtures and exact revision for a compatibility
    claim or incompatible exported change. Q-04 remains unresolved; establish a supported route or coordinated
    adapter before such a change without commissioning one by this need.
  when: Claiming named compatibility or changing a consumed interface incompatibly
  evidence: execution/PKG-03/DEL-03-01/Work/ToolBasis.md
- from: DEL-02-01
  condition: Use the applicable preceding maintenance/review method and actual change authority for a
    utility or usage-instruction repair, with proportionate verification and recovery of its previous
    basis.
  when: Carrying a toolkit change through review and integration
  evidence: execution/PKG-03/DEL-03-01/Work/ToolBasis.md
- from: DEL-04-01
  condition: Apply the existing same-PR reconciliation practice to the actual utility result, direct usage
    instructions, affected callers and local conditions; unchanged declarations remain unchanged. This
    is a different use from supplying live query inputs.
  when: Reconciling an actual toolkit change before integration
  evidence: execution/PKG-03/DEL-03-01/Work/ToolBasis.md
