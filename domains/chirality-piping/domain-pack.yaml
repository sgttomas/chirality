name: chirality-piping
description: OpenPipeStress (chirality-piping) domain pack for retrieval-first DOMAIN_DECOMP decomposition of the project's governance, product/spec docs, execution deliverables, and source code.
# Shared agent/skill/tool roots resolve against the chirality monorepo root
# (this pack lives at chirality/domains/chirality-piping/).
canonical_shared_roots:
  agents: ../../agents
  skills: ../../skills
  tools: ../../tools
# The SOURCE corpus is a SIBLING repository, not this monorepo. @repo/<RepoRelPath>
# source references resolve against source_repo_root (pass as --repo-root to
# build_source_database.py / validate_source_database.py).
source_repo_root: ../../projects/chirality-piping
local_roots:
  sources: _Sources
  decomposition: _Decomposition
  coordination: _Coordination
  vocabularies: vocabularies
  indexes: _LocalIndexes
