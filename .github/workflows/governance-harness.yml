# Phase 5 CI wrapper (plan v3 §Roadmap row 5; CI half re-ruled by owner
# 2026-07-02 after Phases 3-4 landed — register item 10 addendum).
#
# Thin wrapper only: runs the practitioner-harness test suite and self-check.
# Objective BLOCK findings exit nonzero per the D-GOV-02 contract and fail the
# run; REVIEW and below exit 0 and never gate (human judgment stays human).
# This workflow adds no checks and holds no authority — authority stays in
# authored files (D-GOV-01). The cache half of Phase 5 remains closed:
# precondition (query pain) unmet.
name: governance-harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: self-check's conditional approval-SHA reachability
          # (git cat-file) must see old commits; a shallow clone would
          # misreport reachable SHAs as unreachable.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python3 -m pip install --quiet pyyaml pytest
      - name: Install zsh (write_status.sh guard is a zsh script; ubuntu runners lack it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Harness test suite
        run: python3 -m pytest tools/practitioner_harness -q
      - name: Self-check (BLOCK findings fail the run per D-GOV-02)
        run: python3 tools/practitioner_harness/harness.py self-check
      - name: G0 root materialization fence (D-GOV-21 §5.3; BLOCK fails the run)
        run: |
          python3 -m pytest tools/validation/test_validate_root_materialization_fence.py -q
          python3 tools/validation/validate_root_materialization_fence.py
      # G1-G4: guard capability per D-GOV-21 §6 step 6. Capability only — guard
      # state (adapter, ownership register, first accepted work graph) is
      # instantiated later by root Project Setup, so each guard is PASS-idle on
      # the clean tree. BLOCK findings exit nonzero and fail the run (D-GOV-02).
      - name: G1 root harness adapter (D-GOV-21 §5.3; BLOCK fails the run)
        run: |
          python3 -m pytest tools/validation/test_validate_root_harness_adapter.py -q
          python3 tools/validation/validate_root_harness_adapter.py
      - name: G2 root surface-ownership register (D-GOV-21 §5.3; BLOCK fails the run)
        run: |
          python3 -m pytest tools/validation/test_validate_root_surface_ownership.py -q
          python3 tools/validation/validate_root_surface_ownership.py
      - name: G3 root work-graph pre-dispatch check (D-GOV-21 §5.3; BLOCK fails the run)
        run: |
          python3 -m pytest tools/validation/test_validate_root_work_graph_dispatch.py -q
          python3 tools/validation/validate_root_work_graph_dispatch.py
      - name: G4 instruction-surface tranche manifest (D-GOV-21 §5.3; BLOCK fails the run)
        run: |
          python3 -m pytest tools/validation/test_validate_instruction_tranche_manifest.py -q
          python3 tools/validation/validate_instruction_tranche_manifest.py
