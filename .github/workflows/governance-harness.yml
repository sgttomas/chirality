# Required tools and repository hygiene checks. Development record gates are retired.
name: governance-harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same PR carry no information; cancel them (PR
# pushes in quick succession previously ran every intermediate commit to
# completion). Push runs on main are never cancelled.
concurrency:
  group: governance-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: self-check's conditional approval-SHA reachability
          # (git cat-file) must see old commits; a shallow clone would
          # misreport reachable SHAs as unreachable. blob:none keeps every
          # commit/tree (reachability and `git log` walks still work) while
          # skipping historical blob download; the harness never reads
          # historical file contents.
          fetch-depth: 0
          filter: blob:none
          # Binary run evidence (traces, screenshots, archives, databases)
          # under _Coordination/AgentRuns is ~1.1 GB of the ~3 GB tree and is
          # read by no gate, self-check or tools test: with it absent the
          # self-check report is byte-identical and every gate passes. Governed
          # binaries elsewhere (e.g. _ScopeChange) stay; a future reader of an
          # excluded file fails loudly as an absent file, never silently.
          sparse-checkout: |
            /*
            !/execution/_Coordination/AgentRuns/**/*.zip
            !/execution/_Coordination/AgentRuns/**/*.png
            !/execution/_Coordination/AgentRuns/**/*.jpg
            !/execution/_Coordination/AgentRuns/**/*.jpeg
            !/execution/_Coordination/AgentRuns/**/*.gz
            !/execution/_Coordination/AgentRuns/**/*.sqlite3
            !/execution/_Coordination/AgentRuns/**/*.bin
            !/projects/*/execution/_Coordination/AgentRuns/**/*.zip
            !/projects/*/execution/_Coordination/AgentRuns/**/*.png
            !/projects/*/execution/_Coordination/AgentRuns/**/*.jpg
            !/projects/*/execution/_Coordination/AgentRuns/**/*.jpeg
            !/projects/*/execution/_Coordination/AgentRuns/**/*.gz
            !/projects/*/execution/_Coordination/AgentRuns/**/*.sqlite3
            !/projects/*/execution/_Coordination/AgentRuns/**/*.bin
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/governance-harness.yml
      - name: Select tool checks
        id: selection
        env:
          CHECKS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 tools/run_affected_tests.py --all --dry-run
          else
            python3 tools/run_affected_tests.py --base "$CHECKS_BASE" --dry-run
          fi
      - name: Install harness dependencies
        if: steps.selection.outputs.has_tests == 'true'
        # numpy: tools/retrieval imports it; installed so those tests stay
        # gated here rather than skipping (coverage ruling 2026-07-31)
        run: python3 -m pip install --quiet pyyaml pytest pytest-xdist numpy
      - name: Deliverable dependency structure
        if: steps.selection.outputs.deliverables == 'true'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PYTHON'
          import subprocess
          import sys
          from pathlib import PurePosixPath
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          projects = set()
          for path in paths:
              parts = PurePosixPath(path).parts
              if parts and parts[-1] == 'deliverable.yaml' and 'execution' in parts:
                  projects.add('/'.join(parts[:parts.index('execution')]) or '.')
          for project in sorted(projects):
              subprocess.run([sys.executable, '-m', 'tools.deliverables', '--project', project, 'check'], check=True)
          PYTHON
      # Owner direction 2026-10-17: implementation returns reconcile their
      # affected ScopeOfWork, Design and dependency conditions before
      # integration. This lists each PR's changed project paths that no
      # deliverable folder or code_paths entry maps, in the job summary. It is
      # a report only: it runs on every PR and can never fail the job. The
      # full-history checkout above supplies the range.
      - name: Deliverable mapping report (report only)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m pip install --quiet pyyaml || true
          python3 - <<'PYTHON' || true
          import json, os, re, subprocess, sys
          from pathlib import PurePosixPath
          LIMIT = 50
          lines = ['### Deliverable mapping (report only)', '']
          def code(value):
              visible = json.dumps(str(value), ensure_ascii=True)[1:-1]
              fence = '`' * (max(map(len, re.findall(r'`+', visible)), default=0) + 1)
              return f'{fence} {visible} {fence}'
          def commit(ref):
              done = subprocess.run(['git', 'rev-parse', '--verify', '--quiet', '--end-of-options', f'{ref}^{{commit}}'], capture_output=True, text=True)
              return done.stdout.strip() if ref and done.returncode == 0 else ''
          try:
              # The PR checkout is GitHub's merge commit: first parent is the base
              # as merged (the event's base can be stale), second is the PR head.
              base, head = commit('HEAD^1'), commit('HEAD^2')
              if not head:
                  base, head = commit(os.environ.get('PR_BASE', '')), commit(os.environ.get('PR_HEAD', ''))
              if not (base and head):
                  raise RuntimeError('pull request base or head commit is not in this checkout')
              paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              projects = set()
              for path in paths:
                  parts = PurePosixPath(path).parts
                  if parts and parts[-1] == 'deliverable.yaml' and 'execution' in parts:
                      projects.add('/'.join(parts[:parts.index('execution')]) or '.')
              lines.append(f'Changed paths in `{base[:10]}...{head[:10]}` matched against each deliverable folder and its `code_paths` '
                           '(`python3 -m tools.deliverables --project <project> touches <base>...<head>`). '
                           'An unmapped path may need a `deliverable.yaml` pointer, or may belong to no deliverable.')
              for project in sorted(projects):
                  lines.append('')
                  try:
                      done = subprocess.run([sys.executable, '-m', 'tools.deliverables', '--project', project, 'touches', f'{base}...{head}'],
                                            capture_output=True, text=True, timeout=120)
                      result = (json.loads(done.stdout) if done.stdout.strip()
                                else {'errors': [(done.stderr.strip().splitlines() or [f'exit {done.returncode}'])[-1]]})
                  except Exception as exc:
                      result = {'errors': [f'{type(exc).__name__}: {exc}']}
                  if 'unmapped_paths' not in result:
                      detail = '; '.join(map(str, result.get('errors') or ['no result']))
                      lines.append(f'**{code(project)}**: report unavailable: {detail[:500]}')
                      continue
                  prefix = '' if project == '.' else project + '/'
                  unmapped = [path for path in result['unmapped_paths'] if path.startswith(prefix)]
                  relevant = result.get('relevant', {})
                  changed = len({path for hits in relevant.values() for path in hits} | set(unmapped))
                  if not changed:
                      lines.append(f'**{code(project)}**: no changed paths.')
                      continue
                  lines.append(f'**{code(project)}**: {changed} changed, {len(unmapped)} unmapped.')
                  if relevant:
                      lines.append('Relevant deliverables: ' + ', '.join(f'{code(key)} ({len(hits)})' for key, hits in sorted(relevant.items())))
                  if result.get('errors'):
                      lines.append('Tool errors: ' + '; '.join(map(str, result['errors']))[:500])
                  if unmapped:
                      lines.append('')
                      lines.extend(f'- {code(path)}' for path in unmapped[:LIMIT])
                      if len(unmapped) > LIMIT:
                          lines.append(f'- ... and {len(unmapped) - LIMIT} more')
          except Exception as exc:
              lines.append(f'Report unavailable: {exc}')
          text = '\n'.join(lines) + '\n'
          print(text)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(text + '\n')
          PYTHON
      - name: Configure canonical Ubuntu package sources
        if: steps.selection.outputs.has_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          test -n "${VERSION_CODENAME}"
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: ${VERSION_CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      # apt-get update dominated this step (~20s). The zsh packages are cached
      # per Ubuntu release and installed with dpkg; a miss or a dpkg failure
      # falls back to the canonical-source apt install. actions/cache never
      # re-saves an exact key hit, so bump -v1 if a cached pair goes bad.
      # Filling the cache is best-effort and can never fail the job.
      - name: Resolve Ubuntu release
        if: steps.selection.outputs.has_tests == 'true'
        id: ubuntu
        run: echo "codename=$(. /etc/os-release && echo "${VERSION_CODENAME}")" >> "${GITHUB_OUTPUT}"
      - name: Restore cached zsh packages
        if: steps.selection.outputs.has_tests == 'true'
        uses: actions/cache@v4
        with:
          path: ~/zsh-debs
          key: zsh-debs-${{ runner.arch }}-${{ steps.ubuntu.outputs.codename }}-v1
      - name: Install zsh (write_status.sh guard is a zsh script)
        if: steps.selection.outputs.has_tests == 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          command -v zsh >/dev/null && exit 0
          if compgen -G "${HOME}/zsh-debs/*.deb" >/dev/null \
            && sudo dpkg -i "${HOME}"/zsh-debs/*.deb >/dev/null; then
            zsh --version
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          rm -rf "${HOME}/zsh-debs" && mkdir -p "${HOME}/zsh-debs"
          (cd "${HOME}/zsh-debs" && apt-get download zsh zsh-common) || rm -rf "${HOME}/zsh-debs"
      - name: Consumed role and workflow package contracts
        if: steps.selection.outputs.instructions == 'true'
        run: |
          python3 tools/validation/validate_agent_instructions.py --json
          python3 tools/validation/validate_workflow_metadata.py --json
      - name: Unresolved conflict markers
        env:
          CONFLICT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify --quiet "${CONFLICT_BASE_REF}^{commit}" >/dev/null; then
            CONFLICT_BASE_REF=HEAD^
          fi
          python3 tools/validation/validate_conflict_markers.py --base "${CONFLICT_BASE_REF}" --head HEAD
      # D-GOV-45: run records are history and are not otherwise tested; only
      # the run records this change adds or modifies are scanned, for
      # credentials (BLOCK) and oversized evidence (WARN). The repo is public.
      - name: Run-record leak check (D-GOV-45; BLOCK fails the run)
        env:
          LEAK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify --quiet "${LEAK_BASE_REF}^{commit}" >/dev/null; then
            LEAK_BASE_REF=HEAD^
          fi
          python3 tools/validation/validate_run_record_leaks.py --base "${LEAK_BASE_REF}" --head HEAD
      # Owner direction 2026-10-08: the owner's machine names never reach this
      # public repository. The terms live only in the PRIVATE_TERMS repository
      # secret and are never printed. What a change adds (contents, paths,
      # commit identities and messages) is matched in any split or escaped
      # form, and a junit hostname attribute blocks even without the secret.
      # Pushes and same-repository PRs require the secret; fork PRs receive
      # no secrets and run the junit rule only.
      - name: Private-term check (owner direction 2026-10-08; BLOCK fails the run)
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          # A PR's recorded base can be stale; the checked-out merge commit's first
          # parent is main as merged, so only this PR's own commits are screened.
          TERMS_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          TERMS_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if ! git rev-parse --verify --quiet "${TERMS_BASE_REF}^{commit}" >/dev/null; then
            TERMS_BASE_REF=HEAD^
          fi
          REQUIRE=()
          if [ "${TERMS_REQUIRED}" = "true" ]; then REQUIRE=(--require-terms); fi
          python3 tools/validation/validate_private_terms.py --base "${TERMS_BASE_REF}" --head HEAD "${REQUIRE[@]}"
      - name: Selected tool behavior tests
        if: steps.selection.outputs.has_tests == 'true'
        env:
          CHECKS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHIRALITY_REQUIRE_LIVE_TESTS: "1"
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 tools/run_affected_tests.py --all
          else
            python3 tools/run_affected_tests.py --base "$CHECKS_BASE"
          fi

  app-v4:
    uses: ./.github/workflows/app-v4.yml
  piping:
    uses: ./.github/workflows/piping-desktop-e2e.yml
  harness:
    name: harness
    needs: [repository-checks, app-v4, piping]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected verification to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f"Verification did not succeed: {failed}")
          print('Repository checks and selected product checks passed.')
          PYTHON
