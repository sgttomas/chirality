name: Harness Pre-merge Validation

on:
  pull_request:
    paths:
      - ".github/workflows/harness-premerge.yml"
      - "projects/chirality-app-dev/**"
      - "projects/chirality-runtime/**"
      - "exports/chirality-app/**"
      - ".agents/skills/**"
      - "agents/**"
      - "docs/**"
      - "workflows/**"
      - "tools/scaffolding/**"
      - "tools/retrieval/**"
      - "tools/scope_of_work/**"
      - "tools/software_workflow/**"
      - "tools/source_catalog/**"
      - "tools/validation/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same PR carry no information; cancel them.
concurrency:
  group: harness-premerge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-premerge:
    name: Harness pre-merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_BASE_URL: http://127.0.0.1:3000
      CHIRALITY_HARNESS_PROVIDER: stub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # execution/ is intentionally excluded and is never read by this job
          # (frontend code references _DomainEngines and project-local
          # execution/ dirs only, both listed below). Cone mode keeps all
          # root files. blob:none skips download of blobs outside the cone.
          filter: blob:none
          sparse-checkout: |
            .github
            .agents
            _DomainEngines
            agents
            docs
            exports
            init
            plans
            projects
            projects/chirality-runtime
            skills
            tools
            workflows

      - name: Initialize runner paths
        shell: bash
        run: |
          set -euo pipefail
          # The project manifest's legacySessionRoots entry must exist at
          # registration (the runtime realpaths every manifest reference).
          # It is untracked; previously the standalone vitest step created
          # it as a side effect. Declare the dependency explicitly.
          mkdir -p "${GITHUB_WORKSPACE}/projects/chirality-app-dev/frontend/.chirality/sessions"
          RUNTIME_USER_DATA="${RUNNER_TEMP}/chirality-runtime-user-data"
          echo "HARNESS_PROJECT_ROOT=${RUNNER_TEMP}/chirality-harness-workroot" >> "${GITHUB_ENV}"
          echo "CHIRALITY_RUNTIME_USER_DATA=${RUNTIME_USER_DATA}" >> "${GITHUB_ENV}"
          echo "CHIRALITY_RUNTIME_DIRECTORY=${RUNTIME_USER_DATA}/runtime" >> "${GITHUB_ENV}"
          echo "CHIRALITY_RUNTIME_SOCKET_PATH=${RUNTIME_USER_DATA}/runtime/control.sock" >> "${GITHUB_ENV}"
          echo "CHIRALITY_INSTRUCTION_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            projects/chirality-runtime/package-lock.json
            projects/chirality-app-dev/frontend/package-lock.json

      - name: Install and build shared runtime
        run: |
          npm ci
          npm run build
        working-directory: projects/chirality-runtime

      - name: Test shared runtime
        run: npm test -- --maxWorkers=1
        working-directory: projects/chirality-runtime

      - name: Install frontend dependencies
        run: npm ci
        working-directory: projects/chirality-app-dev/frontend

      # The standalone Typecheck and Full Vitest suite steps were removed:
      # the release-quality wrapper below re-runs both as evidence commands
      # (full_test, typecheck in validate-release-quality-evidence.mjs), so
      # the workflow previously ran the entire vitest suite and tsc twice
      # (~58s of duplicated wall time per run). The wrapper's runs are the
      # evidence-bearing gate; its summary is asserted in Verify stable
      # summaries.

      - name: Secret scan
        run: npm run proof:secret-scan
        working-directory: projects/chirality-app-dev/frontend

      - name: Prepare instruction-root integrity fixture
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="${GITHUB_WORKSPACE}"
          FRONTEND="${REPO_ROOT}/projects/chirality-app-dev/frontend"
          BUNDLE_ROOT="${RUNNER_TEMP}/chirality-instruction-root-fixture"

          rm -rf "${BUNDLE_ROOT}"
          node "${FRONTEND}/scripts/prepare-packaged-instruction-root.mjs" \
            --source-root "${REPO_ROOT}" \
            --docs-root "${REPO_ROOT}/docs" \
            --output-root "${BUNDLE_ROOT}/instruction-root"

      - name: Instruction-root integrity
        run: >-
          npm run instruction-root:integrity --
          --root-files-root "${GITHUB_WORKSPACE}"
          --agents-root "${GITHUB_WORKSPACE}/agents"
          --docs-root "${GITHUB_WORKSPACE}/docs"
          --bundle-root "${RUNNER_TEMP}/chirality-instruction-root-fixture/instruction-root"
        working-directory: projects/chirality-app-dev/frontend

      - name: Build controlled CI runtime
        run: node ./scripts/build-controlled-ci-runtime.mjs
        working-directory: projects/chirality-app-dev/frontend

      # The controlled CI runtime is a stub-engine Runtime daemon (no Codex,
      # no sign-in). It registers app-dev from the manifest named by
      # --manifest itself and prints one ready line:
      #   {"status":"ready","purpose":"chirality-controlled-ci-runtime/v1",
      #    "socketPath":...,"tokenFile":...,"projectId":...,"projectRoot":...}
      # tokenFile is the project client token, so no operator token and no CLI
      # registration step are needed (D-GOV-43, A2).
      - name: Start controlled CI runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CHIRALITY_RUNTIME_DIRECTORY}"
          : >/tmp/chirality-runtime-daemon.log
          nohup env \
            CHIRALITY_CONTROLLED_CI_RUNTIME=chirality-controlled-ci-runtime/v1 \
            node out/controlled-ci/controlled-runtime.mjs \
              --manifest "${GITHUB_WORKSPACE}/projects/chirality-app-dev/chirality.project.json" \
            >/tmp/chirality-runtime-daemon.log 2>&1 &
          echo $! >/tmp/chirality-runtime-daemon.pid

          ready=""
          for attempt in $(seq 1 90); do
            ready="$(grep -m1 '"status":"ready"' /tmp/chirality-runtime-daemon.log || true)"
            if [ -n "${ready}" ]; then
              break
            fi
            if ! kill -0 "$(cat /tmp/chirality-runtime-daemon.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ -z "${ready}" ]; then
            echo "Controlled CI runtime did not print its ready line." >&2
            tail -n 200 /tmp/chirality-runtime-daemon.log || true
            exit 1
          fi
          printf '%s\n' "${ready}" >/tmp/chirality-runtime-ready.json

          # The ready line must describe the app-dev project on the declared
          # socket; the project token file is the App's runtime credential.
          project_token="$(
            node -e '
              const fs = require("node:fs");
              const ready = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (ready.status !== "ready" || ready.purpose !== "chirality-controlled-ci-runtime/v1") throw new Error("unexpected runtime purpose");
              for (const field of ["socketPath", "tokenFile", "projectId", "projectRoot"]) {
                if (typeof ready[field] !== "string" || ready[field].length === 0) throw new Error(`ready line is missing ${field}`);
              }
              if (ready.socketPath !== process.env.CHIRALITY_RUNTIME_SOCKET_PATH) throw new Error("ready socketPath differs from CHIRALITY_RUNTIME_SOCKET_PATH");
              if (ready.projectId !== "chirality-app-dev") throw new Error(`unexpected projectId ${ready.projectId}`);
              const expectedRoot = fs.realpathSync(`${process.env.GITHUB_WORKSPACE}/projects/chirality-app-dev`);
              if (ready.projectRoot !== expectedRoot) throw new Error(`unexpected projectRoot ${ready.projectRoot}`);
              process.stdout.write(ready.tokenFile);
            ' /tmp/chirality-runtime-ready.json
          )"

          echo "CHIRALITY_RUNTIME_TOKEN_FILE=${project_token}" >> "${GITHUB_ENV}"
          echo "CHIRALITY_RUNTIME_PROJECT_ID=chirality-app-dev" >> "${GITHUB_ENV}"
          echo "CHIRALITY_RUNTIME_PROJECT_ROOT=${GITHUB_WORKSPACE}/projects/chirality-app-dev" >> "${GITHUB_ENV}"
          echo "HARNESS_PROJECT_ROOT=${GITHUB_WORKSPACE}/projects/chirality-app-dev" >> "${GITHUB_ENV}"
        working-directory: projects/chirality-app-dev/frontend

      - name: Start frontend server
        run: |
          mkdir -p "${HARNESS_PROJECT_ROOT}"
          nohup npm run dev:next -- --hostname 127.0.0.1 --port 3000 \
            >/tmp/chirality-harness-dev.log 2>&1 &
          echo $! >/tmp/chirality-harness-dev.pid
        working-directory: projects/chirality-app-dev/frontend

      - name: Wait for harness API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status="$(curl -sS -o /tmp/harness-ready.json -w "%{http_code}" --get \
              --data-urlencode "projectRoot=${HARNESS_PROJECT_ROOT}" \
              "${HARNESS_BASE_URL}/api/harness/session/list" || true)"

            if [ "${status}" = "200" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "Harness API did not become ready at ${HARNESS_BASE_URL}." >&2
          tail -n 200 /tmp/chirality-harness-dev.log || true
          exit 1

      - name: Release-quality wrapper
        run: npm run validate:release-quality
        working-directory: projects/chirality-app-dev/frontend

      - name: Verify stable summaries
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); for (const [p,s] of [["projects/chirality-app-dev/frontend/artifacts/harness/section8/latest/summary.json","pass"],["projects/chirality-app-dev/frontend/artifacts/harness/release-quality/latest/summary.json","pass"],["projects/chirality-app-dev/frontend/artifacts/harness/instruction-root-integrity/latest/summary.json","pass"],["projects/chirality-app-dev/frontend/artifacts/harness/security/latest/secret-scan-summary.json","pass"]]) { const value=JSON.parse(fs.readFileSync(p,"utf8")); if (value.status!==s) throw new Error(`${p}: expected ${s}, got ${value.status}`); }'

      - name: Upload validation summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-validation-summaries
          path: |
            projects/chirality-app-dev/frontend/artifacts/harness/section8/latest/summary.json
            projects/chirality-app-dev/frontend/artifacts/harness/release-quality/latest/summary.json
            projects/chirality-app-dev/frontend/artifacts/harness/instruction-root-integrity/latest/summary.json
            projects/chirality-app-dev/frontend/artifacts/harness/security/latest/secret-scan-summary.json
          if-no-files-found: warn

      - name: Print frontend server logs on failure
        if: failure()
        run: |
          tail -n 200 /tmp/chirality-harness-dev.log || true
          tail -n 200 /tmp/chirality-runtime-daemon.log || true

      - name: Stop frontend server
        if: always()
        run: |
          if [ -f /tmp/chirality-harness-dev.pid ]; then
            kill "$(cat /tmp/chirality-harness-dev.pid)" || true
          fi
          if [ -f /tmp/chirality-runtime-daemon.pid ]; then
            kill "$(cat /tmp/chirality-runtime-daemon.pid)" || true
          fi
