name: Harness Pre-merge Validation

on:
  pull_request:
    paths:
      - ".github/workflows/harness-premerge.yml"
      - "projects/chirality-app-dev/**"
      - "agents/**"
      - "AGENTS.md"
      - "README.md"
      - "PROFESSIONAL_ENGINEERING.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-premerge:
    name: Harness pre-merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_BASE_URL: http://127.0.0.1:3000
      CHIRALITY_HARNESS_PROVIDER: stub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize runner paths
        shell: bash
        run: echo "HARNESS_PROJECT_ROOT=${RUNNER_TEMP}/chirality-harness-workroot" >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/chirality-app-dev/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: projects/chirality-app-dev/frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: projects/chirality-app-dev/frontend

      - name: Pi supply-chain policy
        run: npm run pi:supply-chain
        working-directory: projects/chirality-app-dev/frontend

      - name: Secret scan
        run: npm run proof:secret-scan
        working-directory: projects/chirality-app-dev/frontend

      - name: Full Vitest suite
        run: npm run test -- --testTimeout=60000
        working-directory: projects/chirality-app-dev/frontend

      - name: Prepare instruction-root integrity fixture
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="${GITHUB_WORKSPACE}"
          FRONTEND="${REPO_ROOT}/projects/chirality-app-dev/frontend"
          BUNDLE_ROOT="${RUNNER_TEMP}/chirality-instruction-root-fixture"
          SDK_PLATFORM="claude-agent-sdk-linux-$(node -p 'process.arch')"

          rm -rf "${BUNDLE_ROOT}"
          mkdir -p \
            "${BUNDLE_ROOT}/agents" \
            "${BUNDLE_ROOT}/docs" \
            "${BUNDLE_ROOT}/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk" \
            "${BUNDLE_ROOT}/app.asar.unpacked/node_modules/@anthropic-ai/${SDK_PLATFORM}"

          cp "${REPO_ROOT}/AGENTS.md" "${REPO_ROOT}/CLAUDE.md" "${REPO_ROOT}/README.md" \
            "${REPO_ROOT}/PROFESSIONAL_ENGINEERING.md" "${BUNDLE_ROOT}/"
          cp "${REPO_ROOT}"/agents/AGENT_*.md "${BUNDLE_ROOT}/agents/"
          cp \
            "${REPO_ROOT}/projects/chirality-app-dev/docs/DIRECTIVE.md" \
            "${REPO_ROOT}/projects/chirality-app-dev/docs/CONTRACT.md" \
            "${REPO_ROOT}/projects/chirality-app-dev/docs/SPEC.md" \
            "${REPO_ROOT}/projects/chirality-app-dev/docs/TYPES.md" \
            "${REPO_ROOT}/projects/chirality-app-dev/docs/PLAN.md" \
            "${REPO_ROOT}/projects/chirality-app-dev/docs/WHAT-IS-AN-AGENT.md" \
            "${BUNDLE_ROOT}/docs/"
          cp \
            "${FRONTEND}/node_modules/@anthropic-ai/claude-agent-sdk/package.json" \
            "${FRONTEND}/node_modules/@anthropic-ai/claude-agent-sdk/sdk.mjs" \
            "${FRONTEND}/node_modules/@anthropic-ai/claude-agent-sdk/manifest.json" \
            "${BUNDLE_ROOT}/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk/"
          cp \
            "${FRONTEND}/node_modules/@anthropic-ai/${SDK_PLATFORM}/package.json" \
            "${FRONTEND}/node_modules/@anthropic-ai/${SDK_PLATFORM}/claude" \
            "${BUNDLE_ROOT}/app.asar.unpacked/node_modules/@anthropic-ai/${SDK_PLATFORM}/"

      - name: Instruction-root integrity
        run: >-
          npm run instruction-root:integrity --
          --root-files-root "${GITHUB_WORKSPACE}"
          --agents-root "${GITHUB_WORKSPACE}/agents"
          --docs-root "${GITHUB_WORKSPACE}/projects/chirality-app-dev/docs"
          --bundle-root "${RUNNER_TEMP}/chirality-instruction-root-fixture"
        working-directory: projects/chirality-app-dev/frontend

      - name: Start frontend server
        run: |
          mkdir -p "${HARNESS_PROJECT_ROOT}"
          nohup npm run dev:next -- --hostname 127.0.0.1 --port 3000 \
            >/tmp/chirality-harness-dev.log 2>&1 &
          echo $! >/tmp/chirality-harness-dev.pid
        working-directory: projects/chirality-app-dev/frontend

      - name: Wait for harness API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status="$(curl -sS -o /tmp/harness-ready.json -w "%{http_code}" --get \
              --data-urlencode "projectRoot=${HARNESS_PROJECT_ROOT}" \
              "${HARNESS_BASE_URL}/api/harness/session/list" || true)"

            if [ "${status}" = "200" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "Harness API did not become ready at ${HARNESS_BASE_URL}." >&2
          tail -n 200 /tmp/chirality-harness-dev.log || true
          exit 1

      - name: Release-quality wrapper
        run: npm run validate:release-quality
        working-directory: projects/chirality-app-dev/frontend

      - name: Verify stable summaries
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); for (const [p,s] of [["projects/chirality-app-dev/frontend/artifacts/harness/section8/latest/summary.json","pass"],["projects/chirality-app-dev/frontend/artifacts/harness/release-quality/latest/summary.json","pass"],["projects/chirality-app-dev/frontend/artifacts/harness/instruction-root-integrity/latest/summary.json","pass"],["projects/chirality-app-dev/frontend/artifacts/harness/security/latest/secret-scan-summary.json","pass"]]) { const value=JSON.parse(fs.readFileSync(p,"utf8")); if (value.status!==s) throw new Error(`${p}: expected ${s}, got ${value.status}`); }'

      - name: Upload validation summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-validation-summaries
          path: |
            projects/chirality-app-dev/frontend/artifacts/harness/section8/latest/summary.json
            projects/chirality-app-dev/frontend/artifacts/harness/release-quality/latest/summary.json
            projects/chirality-app-dev/frontend/artifacts/harness/instruction-root-integrity/latest/summary.json
            projects/chirality-app-dev/frontend/artifacts/harness/security/latest/secret-scan-summary.json
          if-no-files-found: warn

      - name: Print frontend server logs on failure
        if: failure()
        run: tail -n 200 /tmp/chirality-harness-dev.log || true

      - name: Stop frontend server
        if: always()
        run: |
          if [ -f /tmp/chirality-harness-dev.pid ]; then
            kill "$(cat /tmp/chirality-harness-dev.pid)" || true
          fi
