name: Piping Desktop E2E

# A cheap selector runs on every PR so the stable check can report a validated
# not-applicable result for unrelated monorepo changes.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Metadata edits/labels do not launch a run or a competing stable check.
  # After retargeting a PR, deliberately dispatch full coverage with the new
  # target base SHA, or update/reopen the PR to validate its current event base.
  workflow_dispatch:
    inputs:
      target_base:
        description: "Target base commit SHA for a retarget/integration proof (optional)"
        required: false
        type: string

permissions:
  contents: read

# Keep only the current run for a pull request while allowing manually
# dispatched branch proofs to finish independently.
concurrency:
  group: piping-desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  PLAYWRIGHT_HTML_OPEN: never
  PLAYWRIGHT_WORKERS: "1"

jobs:
  selection:
    name: Select source coverage
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      numerical_required: ${{ steps.plan.outputs.numerical_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Keep ancestry checks without downloading all historical evidence blobs.
          filter: blob:none
      - name: Test selection policy
        run: python3 -m unittest discover -s projects/chirality-piping/tests -p 'test_ci_*.py' -v
      - name: Plan complete PR diff
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || inputs.target_base }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          python3 projects/chirality-piping/tools/ci/e2e_plan.py plan
          --event "$EVENT" --base "$BASE" --head "$HEAD" --pr "$PR"
          --output piping-e2e-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piping-e2e-selection
          path: piping-e2e-plan.json
          if-no-files-found: error
          retention-days: 14

  barrier:
    name: Accessibility barrier and selected coverage
    needs: selection
    if: needs.selection.outputs.mode != 'not-applicable'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Keep ancestry checks without downloading all historical evidence blobs.
          filter: blob:none
      - uses: actions/download-artifact@v4
        with:
          name: piping-e2e-selection
      - uses: ./.github/actions/setup-piping-e2e
      - name: Run accessibility first, then any reduced selection
        run: python3 projects/chirality-piping/tools/ci/e2e_plan.py run --plan piping-e2e-plan.json --stage barrier --evidence-dir piping-e2e-collection/barrier
      - name: Retain candidate collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piping-e2e-collection-barrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: piping-e2e-collection/barrier
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: piping-desktop-e2e-barrier-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            projects/chirality-piping/apps/desktop/playwright-report
            projects/chirality-piping/apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 14

  remainder:
    name: Source remainder (${{ matrix.shard }}/4)
    needs: [selection, barrier]
    if: needs.selection.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Keep ancestry checks without downloading all historical evidence blobs.
          filter: blob:none
      - uses: actions/download-artifact@v4
        with:
          name: piping-e2e-selection
      - uses: ./.github/actions/setup-piping-e2e
      - name: Run isolated source remainder shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 projects/chirality-piping/tools/ci/e2e_plan.py run --plan piping-e2e-plan.json --stage remainder --shard "$SHARD" --evidence-dir "piping-e2e-collection/shard-$SHARD"
      - name: Retain candidate shard collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piping-e2e-collection-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: piping-e2e-collection/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: piping-desktop-e2e-shard-${{ matrix.shard }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            projects/chirality-piping/apps/desktop/playwright-report
            projects/chirality-piping/apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 14

  numerical:
    name: Numerical cargo suite
    needs: selection
    if: needs.selection.outputs.numerical_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@v4
        with:
          name: piping-e2e-selection
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Fetch locked dependencies and run offline numerical tests
        run: python3 projects/chirality-piping/tools/ci/numerical_ci.py --plan piping-e2e-plan.json --evidence-dir piping-numerical-evidence
      - name: Retain numerical candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piping-numerical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            piping-numerical-evidence/numerical.json
            piping-numerical-evidence/*.log
            piping-numerical-evidence/cargo-logs/*.log
          if-no-files-found: error
          retention-days: 14

  desktop-e2e:
    name: Desktop E2E (source mode)
    needs: [selection, barrier, remainder, numerical]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require all planned coverage
        env:
          MODE: ${{ needs.selection.outputs.mode }}
          SELECTION: ${{ needs.selection.result }}
          BARRIER: ${{ needs.barrier.result }}
          REMAINDER: ${{ needs.remainder.result }}
          NUMERICAL_REQUIRED: ${{ needs.selection.outputs.numerical_required }}
          NUMERICAL: ${{ needs.numerical.result }}
        run: >-
          python3 projects/chirality-piping/tools/ci/e2e_plan.py aggregate
          --mode "$MODE" --selection "$SELECTION" --barrier "$BARRIER" --remainder "$REMAINDER"
          --numerical-required "$NUMERICAL_REQUIRED" --numerical "$NUMERICAL"
