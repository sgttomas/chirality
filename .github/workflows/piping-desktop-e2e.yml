name: Piping Desktop E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
concurrency:
  group: piping-desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: "true"
  PLAYWRIGHT_HTML_OPEN: never
  PLAYWRIGHT_WORKERS: "1"

jobs:
  selection:
    name: Select consequential checks
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      numerical_mode: ${{ steps.numeric.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/execution/
            !/projects/*/execution/
          sparse-checkout-cone-mode: false
      - name: Select from the complete PR diff
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/software_workflow/hosted_ci.py plan --suite piping --event "$EVENT" --base "$BASE" --head "$HEAD" --output piping-ci-plan.json
      - name: Read numerical selection
        id: numeric
        run: |
          python3 - <<'PYTHON'
          import json, os
          mode = json.load(open('piping-ci-plan.json'))['modes']['piping-numerical']
          if mode not in {'full', 'not-applicable'}:
              raise SystemExit('Invalid numerical selection')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'mode={mode}\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: piping-ci-selection
          path: piping-ci-plan.json
          retention-days: 7

  product:
    name: Build, behaviour and core browser journey
    needs: selection
    if: needs.selection.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/execution/
            !/projects/*/execution/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-piping-e2e
      - name: Desktop behaviour (including persistence and undo)
        run: npm run test:desktop
        working-directory: projects/chirality-piping
      - name: Production build
        run: npm run build:desktop
        working-directory: projects/chirality-piping
      - name: Core browser journey and save/reopen
        run: npm run test:e2e:desktop -- --project=chromium-desktop r2-smoke.spec.ts b3b-project-persistence.spec.ts
        working-directory: projects/chirality-piping
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: piping-browser-failure
          path: |
            projects/chirality-piping/apps/desktop/playwright-report
            projects/chirality-piping/apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 7

  numerical:
    name: Numerical oracles and product Python contracts
    needs: selection
    if: needs.selection.outputs.numerical_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/execution/
            !/projects/*/execution/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python check dependencies
        run: python3 -m pip install -r projects/chirality-piping/requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: piping-ci-selection
      - name: Locked Cargo numerical suite
        run: python3 projects/chirality-piping/tools/ci/numerical_ci.py --plan piping-ci-plan.json --evidence-dir piping-numerical-evidence
      - name: Python product contracts and qualification oracles
        working-directory: projects/chirality-piping
        run: >-
          python3 -m pytest -q tests/product_preview tests/security
          tests/test_*schema.py tests/test_*schemas.py
          tests/test_qualification*.py tests/test_*canonical_json_adapter.py
          tests/test_constraint_validation.py tests/test_source_blocks_validation.py
          tests/test_operation_validation_preview.py tests/test_analytical_solver_boundary_adapter.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: piping-numerical-failure
          path: |
            piping-numerical-evidence/numerical.json
            piping-numerical-evidence/*.log
            piping-numerical-evidence/cargo-logs/*.log
          if-no-files-found: warn
          retention-days: 7

  browser-matrix:
    name: Broad browser matrix (${{ matrix.shard }}/4)
    needs: selection
    if: github.event_name != 'pull_request' && needs.selection.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/execution/
            !/projects/*/execution/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-piping-e2e
      - run: npm run test:e2e:desktop -- --shard=${{ matrix.shard }}/4
        working-directory: projects/chirality-piping
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: piping-matrix-failure-${{ matrix.shard }}
          path: projects/chirality-piping/apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 7

  desktop-e2e:
    name: Desktop E2E (source mode)
    needs: [selection, product, numerical]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/execution/
            !/projects/*/execution/
          sparse-checkout-cone-mode: false
      - name: Report selected checks without treating skipped work as passed
        env:
          MODE: ${{ needs.selection.outputs.mode }}
          NUMERICAL_MODE: ${{ needs.selection.outputs.numerical_mode }}
          SELECTION: ${{ needs.selection.result }}
          PRODUCT: ${{ needs.product.result }}
          NUMERICAL: ${{ needs.numerical.result }}
        run: |
          python3 tools/software_workflow/hosted_ci.py aggregate --suite piping --mode "$MODE" --selection "$SELECTION" --product "$PRODUCT"
          python3 tools/software_workflow/hosted_ci.py aggregate --suite piping-numerical --mode "$NUMERICAL_MODE" --selection "$SELECTION" --product "$NUMERICAL"
