name: Piping Windows headless startup diagnostic
on:
  pull_request:
    paths:
      - 'projects/chirality-piping/core/**'
      - 'projects/chirality-piping/validation/benchmarks/**'
      - 'projects/chirality-piping/fixtures/**'
      - 'projects/chirality-piping/validation/platform/windows_runner_startup_probe/**'
      - 'projects/chirality-piping/tools/release/**'
      - 'projects/chirality-piping/provenance/**'
      - '.github/workflows/piping-windows-runner-startup-probe.yml'
      - '.cargo/**'
      - 'Cargo.*'
      - 'rust-toolchain*'
      - '.gitattributes'
      - 'projects/chirality-piping/.cargo/**'
      - 'projects/chirality-piping/Cargo.*'
      - 'projects/chirality-piping/rust-toolchain*'
      - 'projects/chirality-piping/.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Product source, all actual dependencies/fixtures/locks are included.
          # Historical execution long paths are excluded without host Git changes.
          sparse-checkout: |
            /*
            !/execution/
            !/projects/*/execution/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Fresh unchanged artifact and finite native cases
        timeout-minutes: 45
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./projects/chirality-piping/validation/platform/windows_runner_startup_probe/run.ps1
  export-boundary:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/execution/
            !/projects/*/execution/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Full committed public export including dependency-free native linter
        timeout-minutes: 20
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $top = git rev-parse --show-toplevel
          Set-Location $top
          $sourcePath = [IO.Path]::GetFullPath($top)
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD -or (git status --porcelain --untracked-files=all)) { throw 'Clean exact committed candidate required' }
          if (-not $IsWindows -or [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'X64' -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne 'X64') { throw 'Native x64 Windows required' }
          $rust = (rustc -Vv) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $rust -notmatch '(?m)^release: 1\.97\.1$' -or $rust -notmatch '(?m)^host: x86_64-pc-windows-msvc$') { throw 'Wrong Rust version/host' }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP ('startup-export-linter-' + [Guid]::NewGuid().ToString('N'))
          $export = Join-Path $env:RUNNER_TEMP ('startup-public-export-' + [Guid]::NewGuid().ToString('N'))
          Write-Host 'START protected-content linter compile/link (unchanged committed source)'
          cargo build --locked --manifest-path projects/chirality-piping/core/reporting/protected_content_linter/Cargo.toml --bin protected_content_lint_cli 2>&1 | ForEach-Object { "$_".Replace($sourcePath,'<source>').Replace($top,'<source>').Replace($env:USERPROFILE,'<account>').Replace($env:RUNNER_TEMP,'<temp>') }
          if ($LASTEXITCODE -ne 0) { throw 'Native export linter compile/link failed' }
          # The unchanged exporter stages every committed public member (git blobs),
          # even when private historical execution files were not checked out.
          # cargo run inside it uses the just-built same-source linter on this head.
          python -u projects/chirality-piping/tools/release/export_public_openpipestress.py --execute --target $export 2>&1 | ForEach-Object { "$_".Replace($sourcePath,'<source>').Replace($top,'<source>').Replace($env:USERPROFILE,'<account>').Replace($env:RUNNER_TEMP,'<temp>') }
          if ($LASTEXITCODE -ne 0) { throw 'Full raw-candidate export boundary/lint failed' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD -or (git status --porcelain --untracked-files=all)) { throw 'Export/build changed raw candidate inputs' }
          $record = Get-Content (Join-Path $export 'export-record.json') -Raw | ConvertFrom-Json -Depth 100
          if ($record.source.git.commit_hash -ne $env:EXPECTED_HEAD -or $record.gate_result -ne 'pass') { throw 'Export record candidate/gate mismatch' }
          # Parent-owned P7 inventory must already include each actual fixture hash.
          $scope = Get-Content projects/chirality-piping/tools/release/provenance_scope.json -Raw | ConvertFrom-Json -Depth 100
          $complete = $true
          foreach ($file in Get-ChildItem projects/chirality-piping/validation/platform/windows_runner_startup_probe/fixtures/*.json) {
            $relative = 'validation/platform/windows_runner_startup_probe/fixtures/' + $file.Name
            $entry = @($scope.members | Where-Object { $_.path -ceq $relative })
            if ($entry.Count -ne 1 -or $entry[0].sha256 -cne (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { $complete = $false }
          }
          if (-not $complete) { throw 'PRELIMINARY export only: parent-generated P7 scope not yet integrated; final candidate evidence unavailable' }
          Write-Host "Full committed export boundary/lint passed candidate=$env:EXPECTED_HEAD; release/owner scan and P7 scanner checks remain separate."
          Remove-Item -Recurse -Force $export,$env:CARGO_TARGET_DIR
