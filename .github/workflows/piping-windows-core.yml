name: TEMPORARY export lint batching proof
on:
  pull_request:
    paths: [.github/workflows/piping-windows-core.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: f1e00132e065fa6681b11f2584d86e7541231336
          path: source
          persist-credentials: false
          sparse-checkout: |
            /*
            !/execution/
            !/projects/*/execution/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Existing Python test dependencies
        working-directory: source
        run: python -m pip install -r projects/chirality-piping/requirements-dev.txt
      - name: Native command limit and same-source same-target export proof
        shell: python
        env:
          REPAIR_SOURCE_SHA: f1e00132e065fa6681b11f2584d86e7541231336
          BASELINE_SOURCE_SHA: d06895bb0db94ca88eefb2eaf1366a197b70d27d
        run: |
          import filecmp, hashlib, json, os, platform, shutil, subprocess, sys, tempfile, types
          from pathlib import Path, PureWindowsPath
          repo = Path('source').resolve()
          project = repo / 'projects/chirality-piping'
          relative = 'projects/chirality-piping/tools/release/export_public_openpipestress.py'
          script = repo / relative
          repair = os.environ['REPAIR_SOURCE_SHA']
          base = os.environ['BASELINE_SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=repo, text=True).strip() == repair
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], cwd=repo, check=True)
          temporary = Path(tempfile.mkdtemp(prefix='export-batch-proof-', dir=os.environ['RUNNER_TEMP']))
          os.environ['CARGO_TARGET_DIR'] = str(temporary / 'cargo-target')
          proof = {'repair_sha': repair, 'baseline_sha': base, 'platform': platform.system()}
          def load(revision, name):
              raw = subprocess.check_output(['git', 'show', revision + ':' + relative], cwd=repo)
              module = types.ModuleType(name)
              module.__file__ = str(script)
              sys.modules[name] = module
              exec(compile(raw, str(script), 'exec'), module.__dict__)
              return module, hashlib.sha256(raw).hexdigest()
          baseline, proof['baseline_exporter_sha256'] = load(base, 'baseline_exporter')
          candidate, proof['candidate_exporter_sha256'] = load(repair, 'candidate_exporter')
          assert script.read_bytes() == subprocess.check_output(['git', 'show', repair + ':' + relative], cwd=repo)
          fixed_clock = baseline.utc_now()
          baseline.utc_now = candidate.utc_now = lambda: fixed_clock
          if os.name == 'nt':
              assert platform.machine().lower() in ('amd64', 'x86_64')
              oversized = [sys.executable, '-c', 'pass'] + [
                  str(PureWindowsPath('C:/harmless argument proof') / (('long segment ' * 10) + str(i)))
                  for i in range(400)
              ]
              units = len(subprocess.list2cmdline(oversized).encode('utf-16-le')) // 2 + 1
              assert units > 32767
              try:
                  subprocess.run(oversized, capture_output=True, timeout=10, check=True)
              except OSError as error:
                  proof['native_limit_control'] = {'units': units, 'winerror': error.winerror}
                  assert error.winerror == 206
              else:
                  raise AssertionError('oversized native command unexpectedly executed')
              subprocess.run([sys.executable, '-c', 'pass', 'short control'], check=True, timeout=10)
          subprocess.run([
              sys.executable, '-m', 'pytest', '-q',
              'projects/chirality-piping/tests/test_export_public_openpipestress.py',
              '-k', 'serialized_utf16_command or preserve_every_finding or one_path_cannot_fit'
          ], cwd=repo, env={**os.environ, 'OPENPIPESTRESS_NO_CARGO_BUILD': '1'}, check=True)
          subprocess.run([
              'cargo', 'build', '--locked', '--manifest-path', candidate.LINTER_MANIFEST,
              '--bin', candidate.LINT_CLI_BIN
          ], cwd=project, check=True)
          os.environ['CARGO_NET_OFFLINE'] = 'true'
          binary = Path(os.environ['CARGO_TARGET_DIR']) / 'debug' / (candidate.LINT_CLI_BIN + ('.exe' if os.name == 'nt' else ''))
          proof['linter_binary_sha256'] = hashlib.sha256(binary.read_bytes()).hexdigest()
          native_errors = []
          original_baseline_run = baseline.run_command
          def baseline_run(command, cwd):
              try:
                  return original_baseline_run(command, cwd)
              except OSError as error:
                  native_errors.append({
                      'units': len(subprocess.list2cmdline(command).encode('utf-16-le')) // 2 + 1,
                      'exception': type(error).__name__, 'winerror': getattr(error, 'winerror', None)
                  })
                  raise
          if os.name == 'nt':
              baseline.run_command = baseline_run
          output = temporary / 'export'
          baseline_result = baseline.run_execute(project, output, False, project)
          baseline_lint = json.loads((output / baseline.LINT_RUN_NAME).read_text())
          proof['baseline_exit'] = baseline_result
          proof['baseline_lint_status'] = baseline_lint['status']
          snapshot = temporary / 'baseline-output'
          shutil.copytree(output, snapshot)
          if os.name == 'nt':
              assert baseline_result == 1 and baseline_lint['status'] == 'engine_unavailable'
              assert native_errors and native_errors[0]['winerror'] == 206 and native_errors[0]['units'] > 32767
              proof['actual_baseline_native_errors'] = native_errors
          else:
              assert baseline_result == 0
          visited = []
          batch_units = []
          original_candidate_run = candidate.run_command
          def candidate_run(command, cwd):
              if command[:2] == ['cargo', 'run']:
                  size = len(subprocess.list2cmdline(command).encode('utf-16-le')) // 2 + 1
                  batch_units.append(size)
                  if os.name == 'nt':
                      assert size <= 30000
                  visited.extend(command[command.index('external') + 1:])
              return original_candidate_run(command, cwd)
          candidate.run_command = candidate_run
          candidate_result = candidate.run_execute(project, output, True, project)
          assert candidate_result == 0
          assert visited == [str(p) for p in candidate.lintable_staged_files(output / candidate.STAGING_DIR_NAME)]
          candidate_lint = json.loads((output / candidate.LINT_RUN_NAME).read_text())
          assert candidate_lint['summary']['target_count'] == len(visited)
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == proof['linter_binary_sha256']
          def compare_tree(first, second):
              before = {p.relative_to(first).as_posix() for p in first.rglob('*') if p.is_file()}
              after = {p.relative_to(second).as_posix() for p in second.rglob('*') if p.is_file()}
              assert before == after
              assert all(filecmp.cmp(first / p, second / p, shallow=False) for p in before)
              return len(before)
          proof['identical_staged_files'] = compare_tree(snapshot / candidate.STAGING_DIR_NAME, output / candidate.STAGING_DIR_NAME)
          assert (snapshot / candidate.MANIFEST_NAME).read_bytes() == (output / candidate.MANIFEST_NAME).read_bytes()
          if os.name != 'nt':
              proof['identical_all_output_files'] = compare_tree(snapshot, output)
              assert baseline_lint == candidate_lint
              proof['macos_complete_output_and_findings_identical'] = True
          proof.update({
              'candidate_exit': candidate_result, 'candidate_lint_status': candidate_lint['status'],
              'linted_paths_in_order': len(visited), 'batch_utf16_units': batch_units,
              'same_source_same_target': True, 'clock_fixed_for_comparison_only': True
          })
          summary = Path(os.environ['RUNNER_TEMP']) / 'export-lint-proof-summary.json'
          summary.write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: export-lint-proof-${{ matrix.os }}
          path: ${{ runner.temp }}/export-lint-proof-summary.json
