name: Piping Windows core portability

# Supplemental RT-V7 feasibility evidence; this does not qualify the desktop
# or add Windows to the macOS-first release matrix / required harness result.
on:
  pull_request:
    paths:
      - .github/workflows/piping-windows-core.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain*
      - projects/chirality-piping/.cargo/**
      - projects/chirality-piping/Cargo.toml
      - projects/chirality-piping/Cargo.lock
      - projects/chirality-piping/rust-toolchain*
      - projects/chirality-piping/core/**
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: piping-windows-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Windows x64 core (MSVC)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: projects/chirality-piping
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/swbpipe-windows-core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Identify native x64 Windows evidence
        run: |
          if (-not $IsWindows -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'This lane requires native x64 Windows; label Arm/emulated evidence separately.'
          }
          $identity = rustc -Vv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify rustc.' }
          if ($identity -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Expected the x64 MSVC toolchain.' }
          $identity
          $candidate = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the checked-out candidate.' }
          "Candidate: $candidate; runner architecture: $env:RUNNER_ARCH"
      - name: Exercise existing core oracles
        run: |
          # No new reference values or tolerances. The curved-bend crate includes
          # platform_bits_tests::formation_bits_are_frozen; run its whole suite.
          $manifests = @(
            'core/solver/frame_kernel/Cargo.toml',
            'core/solver/curved_bend/Cargo.toml',
            'core/solver/sparse_direct/Cargo.toml',
            'core/serialization/canonical_json/Cargo.toml'
          )
          foreach ($manifest in $manifests) {
            cargo test --locked --target x86_64-pc-windows-msvc --manifest-path $manifest
            if ($LASTEXITCODE -ne 0) { throw "Core portability failed: $manifest" }
          }
      - name: Check the engineering facade and its dependencies
        run: |
          # Compilation only: no retained-profile qualification, stack witness,
          # native worker, persistence, WebView2 or packaging claim.
          cargo check --locked --target x86_64-pc-windows-msvc --lib --manifest-path core/product_physics/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Product-physics Windows compilation failed.' }
