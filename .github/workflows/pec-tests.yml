# PEC project test suite (coverage ruling, 2026-07-31): 356 tests across
# the core/server/agent-sidecar workspaces previously ran nowhere
# automatically. Runs on changes to projects/pec/** only.
name: pec-tests

on:
  pull_request:
    paths:
      - ".github/workflows/pec-tests.yml"
      - "projects/pec/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pec-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            projects/pec
      - uses: actions/setup-node@v4
        with:
          # engines requires >= 23.6 (native TS type-stripping)
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/pec/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/pec
      - name: Run workspace test suites
        run: npm test
        working-directory: projects/pec
