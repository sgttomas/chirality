scope_limits:
  - SPEC changes only in section 3.3 (transition row and the reopening rule, now naming the ScopeChanging column and the tool check); TYPES and section 3.4 are unchanged.
  - The D-GOV-50 rule is unchanged in substance; D-GOV-51 makes RECLASSIFY's scope condition a recorded register field and replaces the deferred-enforcement wording with the actual check and its limits.
  - write_status.sh changes only the ISSUED -> IN_PROGRESS branch and adds the --amendment argument (a usage error on any other transition); every other refusal, including the human-ruled CHECKING -> IN_PROGRESS reversal, is unchanged. Reopening requires --approval-sha on every root, including roots whose adapter declares no approval-SHA schema.
  - The checker reads recorded structure and hashes only; it does not establish the genuineness of the human act or interpret a decision beyond its first heading, and grants nothing (K-AUTH-1).
  - projects/chirality-app-dev, including its frontend transition.ts, is not changed; the App mirrors the checker in its own pull request.
  - Accepted SCA snapshots, registers and _STATUS.md records are not rewritten; registers without ScopeChanging remain valid as legacy registers.
  - In the decisions register the D-GOV-51 row is added and D-GOV-50's publication SHA (6b48b6f26ed3e9ef60fde1c7d2289843bd1aea25, merge of PR #955) is recorded under K-AUTH-2 with a pointer to D-GOV-51; other rows are unchanged, and D-GOV-51's own publication SHA is left for the next register touch.
  - The alignment manual does not render the changed text and is unchanged; workflows/index.json regenerates unchanged.
  - No release is granted.
