m2_gate:
  authorization: >-
    The repository owner directed on 2026-09-26, in the Claude Code
    conversation, "D1 and D2 as recommended, D3 (a), and D4 yes proceed that
    way. Your work plan is approved." The approved wave-2 plan enforces
    D-GOV-50 (reopening an ISSUED deliverable under an accepted amendment) in
    the Root tool. D1 as recommended adds a ScopeChanging column (YES/NO) to
    the scope-change accepted action register, recorded at checkpoint-group-2
    acceptance; the tools admit ISSUED -> IN_PROGRESS when the register names
    the deliverable with MODIFY, or RECLASSIFY with ScopeChanging YES; for a
    register without the column (legacy) the tool refuses RECLASSIFY and the
    human records that reopening directly, while MODIFY is still admitted.
    Applied here as: a deterministic checker
    tools/validation/check_amendment_reopen.py (group-3 decision snapshot
    recording acceptance; register bound by SHA-256 in the group-2
    ACCEPTED_MANIFEST.csv and unchanged; a qualifying DELIVERABLE row;
    containment inside the scope-change root); write_status.sh admitting
    ISSUED -> IN_PROGRESS only for a HUMAN actor with --approval-sha and a new
    --amendment argument that passes the checker, recording the amendment and
    approval SHA in history, every other refusal unchanged; the scope-change
    contract and method, SPEC section 3.3 and project-setup Phase 5.5 aligned;
    and decision record D-GOV-51.
  authorized_by: Ryan Tufts (repository owner sgttomas, current Claude Code conversation)
  authorization_date: '2026-09-26'
  integration_owner: >-
