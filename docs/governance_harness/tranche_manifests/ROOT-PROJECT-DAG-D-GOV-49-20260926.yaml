  rationale: >-
    App, Piping and PEC route development through construct-local-work-graph
    and use project-setup's dependency stage and scc-resolution-case; the App
    keeps its legacy PKG-00 case home. Runtime resolves and packages the
    catalog, in which project-dag is now a core entry. Piping's records call
    its approved DAG the dependency graph authority and its local registers
    synchronized mirrors; its notice names that wording as stronger than
    D-GOV-49 and leaves any change to the Piping loop. PEC is being
    redeveloped and the owner is deferring action there; its notice is
    informational only. Each loop decides its own adoption.
scope_limits:
