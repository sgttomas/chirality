  - SPEC changes are limited to the section 0.2.3 containment note, the section 0.3 DAG_ROOT token, the section 1 tree, the section 1.2 _DAG/ registration, a section 5.3 applicability note, new section 5.4, the section 6.2 annotations and a section 11.2 note.
  - project-dag joins the catalog's core navigation list only; centralWorkflowNames and the Root AGENTS.md table are unchanged.
  - Change project-setup only at its SCC routing and DAG handoff lines and one Phase 3.1 blocker bullet.
  - Do not change audit_dag.py, validate_scc_resolution_case.py, materialize_local_dependencies.py, the dependency-extract mirroring or the review workflow.
  - Do not construct, accept, migrate or modify any project's DAG, dependency register, pointer or SCC case; nothing is retrofitted; no release.
