m2_gate:
  authorization: >-
    The repository owner directed on 2026-09-26 that the deferred project-DAG
    workflow "needs your attention", then clarified K-DEP-1: "The "no central
    dependency graph" was only meant to be about the Chirality repo as a
    whole, because it's made up of projects and each of those projects will
    have it's own DAG for that project as a whole. And then each development
    loop will build a work graph for some tranche of work within that DAG.
    That should be how the governance is written and should be consistent
    with how the projects are being developed now." On local files that
    disagree with the DAG the owner said "local files that break the DAG need
    to trigger an audit but the DAG can't be its own authority", and answered
    the agent's proposed model "yes, write D-GOV-49 that way." The owner
    approved registering _DAG/ in SPEC section 1.2 with snapshots and a
    _LATEST.md pointer, making the three fields audit_dag.py --strict rejects
    REQUIRED for an accepted DAG version, and "We should make that `_DAG/cases`
    be the place where all projects work from going forward, and allow for
    PKG-00 to still be used for legacy projects." The owner said the new
    workflows "can become core". Recorded as D-GOV-49.
  authorized_by: Ryan Tufts (repository owner sgttomas, current Claude Code conversation)
  authorization_date: '2026-09-26'
  integration_owner: >-
    The parent Claude Code integration session under the standing Git
    authorization of 2026-09-12; the authoring worktree commits locally and
    does not push, open or merge the PR.
  merge_gate: owner-authorized-pr
  self_merge: true
