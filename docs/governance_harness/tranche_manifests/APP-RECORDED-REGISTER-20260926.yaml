m6_notice:
  disposition: none-required
  routed_to: []
  rationale: >-
    The change is inside App-owned surfaces: the App SPEC §5.2 paragraph on
    the App's own dependency reads, App frontend source and tests, and App
    run records. It implements Root SPEC §5.2–§5.4 (D-GOV-46, D-GOV-49) as
    those notices already required and does not change any Root instruction,
    role, skill, workflow or tool; the Root reference tools are read, not
    edited. No other loop pins the App SPEC. The Runtime-owned deps_read
    descriptor text is left unchanged and recorded as a limit for the App
    loop rather than routed as a notice. The App authority corpus already
    reported drift for the App SPEC before this change; that drift is
    retained, not repinned.
scope_limits:
  - App SPEC §5.2 replaces its statement that App dependency reads are CSV-only register evidence with the recorded-register behaviour; no other SPEC section changes.
  - Blockers are computed as the Root tools compute them (dependency_evidence.py and the project mode of build_dev001_blocker_queue.py without --evidence); the parity fixtures and their generator are the check. The App reads the default maturity threshold from _COORDINATION.md, falling back to INITIALIZED.
  - The raw Dependencies.csv rows, headers and warnings are unchanged; the recorded register is an additive field, and activeUpstreamBlockerCandidates keeps its name.
  - No lifecycle transition, dependency acceptance, DAG acceptance, authority-corpus repin, Runtime change, release or issuance.
  - The Runtime deps_read descriptor, the generated tool catalog and the App's bundled dependency-extract, project-setup and review workflows are not changed here.
