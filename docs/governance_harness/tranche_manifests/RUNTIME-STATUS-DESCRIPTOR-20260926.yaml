scope_limits:
  - Descriptor metadata only. status_transition gains the optional string inputs ruling and amendment (as the App zod schema declares them), a description of each, and human-gate text naming entry to CHECKING and ISSUED (HUMAN actor, approvalSha, optional ruling), CHECKING -> IN_PROGRESS (HUMAN actor, approvalSha, ruling) and ISSUED -> IN_PROGRESS (HUMAN actor, approvalSha, an amendment that passes the amendment-record check, D-GOV-50 and D-GOV-51). The gate kind stays approval-sha.
  - dependency_read (deps_read) takes the App's recorded-register description and declares the optional recordedRegister output object. That App read landed in PR #972, which is not in this basis; the text is accurate once both are on main.
  - The registry version string, the App handlers, the App MCP schemas and App behavior are unchanged. The App tool catalog is regenerated from the descriptors and a descriptor-parity test is added.
  - No lifecycle transition, authority-corpus repin, UI change (FU3), SOW closeout (FU4), release or issuance.
