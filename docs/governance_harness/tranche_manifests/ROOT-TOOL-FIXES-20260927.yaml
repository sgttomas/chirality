  rationale: >-
    These are tool bug fixes with no change to any rule. The materializer
    change removes only a blank line at end of file: over every
    _DEPENDENCIES.md in the repository, the old and fixed refresh outputs
    differ only at end of file, and the committed Piping DEL-07-09 file is now
    reproduced byte for byte. The validator change enforces placement and the
    one-home rule that docs/SPEC.md §1.2 and §5.4 and the D-GOV-49 notices
    already state ("Each project uses one home for its cases"). A scan of
    every project found SCC case folders only in App's legacy PKG-00 home
    (CASE-SCC-001 and CASE-SCC-002); no project has a case folder under
    _DAG/, and App has no _DAG/cases/. Both App cases give the same PASS and
    exit code 0 before and after the change, so no loop's existing case can
    newly fail and no notice is routed.
scope_limits:
  - The materializer's section separators, idempotence, --refresh-pointers semantics and Dependencies.csv output are unchanged; only a blank line (or missing newline) at end of file is corrected.
  - A legacy PKG-00 case outside _DAG/ keeps its messages and exit codes, except that it now fails when the same project also holds cases under _DAG/cases/.
  - The Case_Datasheet.md case-ID check is unchanged; the workflow has no datasheet template with a single identity field.
  - No project file, workflow rule, SPEC text or workflows/index.json is changed. No release.
