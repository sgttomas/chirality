m6_notice:
  disposition: none-required
  routed_to: []
  rationale: >-
    The change is inside App-owned surfaces: App SPEC §4.3, App frontend
    source and tests, and App run records. It adopts the Root D-GOV-50
    enforcement notice this loop received and does not change any Root
    instruction, role, skill, workflow or tool; the Root checker is read by
    the parity generator, not edited. No other loop pins the App SPEC. The
    Runtime-owned status_transition descriptor is left unchanged and recorded
    as App follow-up FU2 rather than routed as a notice. The App authority
    corpus already reported drift for the App SPEC before this change; that
    drift is retained, not repinned.
scope_limits:
  - App SPEC §4.3 states the reopening rule the tools now enforce (HUMAN actor, format-valid approval SHA, an amendment that passes the ported Root check, the refusal and history behaviour), the D2 gate-evidence metadata rule, and the known limits; no other SPEC section changes.
  - The App amendment check follows tools/validation/check_amendment_reopen.py at the basis commit, with the same admission rules, refusal codes and containment; the parity fixtures, the real-record cases and their generator are the check. A later Root change needs a matching App change and a regenerated expected.json.
  - Known limit. The App runs no git process, so it does not check that the approval SHA is a reachable commit, that the group-3 DECISION.md exists at that commit, or that the amendment records are committed. It reads the working-tree records, so uncommitted edits to them are not detected; write_status.sh is the anchored check. The actor remains caller-asserted.
  - The App finds the Git work-tree top level from the nearest .git entry, uses it as the checker's project root, and requires the scope-change root to lie inside the working root.
  - No lifecycle transition, approval-SHA refresh, authority-corpus repin, Runtime change, UI change, release or issuance. The Runtime status_transition descriptor (FU2) and the workbench and pipeline reopening input (FU3) are not changed here.
