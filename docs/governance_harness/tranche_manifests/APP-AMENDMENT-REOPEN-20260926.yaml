scope_limits:
  - App SPEC §4.3 states the reopening rule the tools now enforce (HUMAN actor, format-valid approval SHA, an amendment that passes the ported Root check, the refusal and history behaviour), the D2 gate-evidence metadata rule, and the known limits; no other SPEC section changes.
  - The App amendment check follows the working-tree mode of tools/validation/check_amendment_reopen.py at the basis commit (anchored group-3 heading, strict decision-folder names, DELIVERABLE_REMOVED, AMENDMENT_ALREADY_USED, the scope-change root beside the outermost execution/ folder with adapter agreement, the latest binding group-2 revision, AmendmentID equal or blank, exact Role, unstripped values), with the same admission rules, refusal codes and containment; the parity fixtures, the real-record cases and their generator are the check. A later Root change needs a matching App change and a regenerated expected.json.
  - Known limit. The App runs no git process, so the Root-only anchored checks are not made, namely APPROVAL_SHA_UNREACHABLE (the approval SHA is a reachable commit), APPROVAL_SHA_NOT_ANCESTOR (it is an ancestor of HEAD) and the at-commit reads of every amendment record. The App reads the working-tree records, so uncommitted edits to them are not detected and its decision is unanchored; write_status.sh uses only the at-commit mode and is the anchored check. The actor remains caller-asserted.
  - Fixes a pre-existing defect. Every App transition rebuilt _STATUS.md from its parsed form, dropping sections after ## History and history lines the parser does not read, including write_status.sh reopening lines, which let a second reopening under the same amendment pass. status-writer.ts now edits in place, and only the first Current State and Last Updated values, the metadata fields it sets or removes above ## History, and one appended history line change. applyLifecycleTransition refuses a result that would drop a reopening marker (HISTORY_NOT_PRESERVED) and a decision that does not name the requested amendment and deliverable. A scan of the 523 tracked _STATUS.md files the App can parse showed no content lost.
  - Amendment records are read up to 5 MiB (a larger one is AMENDMENT_CHECK_ERROR); only a 64 KiB prefix of a group-3 DECISION.md is read. Known limit. The status file is read, checked and rewritten without a lock, so a concurrent write in that window can be lost.
  - The App finds the Git work-tree top level from the nearest .git entry, uses it as the checker's project root, and requires the scope-change root to lie inside the working root.
  - No lifecycle transition, approval-SHA refresh, authority-corpus repin, Runtime change, UI change, release or issuance. The Runtime status_transition descriptor (FU2) and the workbench and pipeline reopening input (FU3) are not changed here.
