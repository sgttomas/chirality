  rationale: >-
    The fix only keeps rows that a rewrite used to delete: local RETIRED rows
    in both modes, and declared RETIRED rows with --canonical-output. It
    changes no rule; it brings the tool into line with the existing rule that
    rows are never deleted. Aggregate row content, header selection, aggregate
    row order and Notes handling are unchanged. No caller relies on the drop:
    apart from its tests, its only importer is dependency_evidence.py, which
    uses only its _DEPENDENCIES.md section parser and heading keys; PEC records that it does not use the tool
    (D-PEC-62). Piping, the only loop that runs it, records the change in the
    same candidate
    (projects/chirality-piping/execution/_Coordination/COORDINATION_RESPONSE_2026-09-27_DEPENDENCY_MATERIALIZATION.md);
    over Piping's 98 registers the fixed tool keeps all 83 retired rows and
    both modes give byte-identical output. The 2026-09-26 dependency
    follow-up notices describe the earlier canonical-mode set-aside of
    RETIRED declared rows as history; tools/REGISTRY.md and the docstring
    state the current behaviour.
scope_limits:
