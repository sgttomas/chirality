m2_gate:
  authorization: >-
    Ryan Tufts directed in the Claude Code conversation on 2026-09-27: "You
    can take care of those remaining items now.  Include the items with the
    "other owners".  You can make changes as necessary." The integrating
    session relayed, as one of those items, the open Piping decision on the
    PR #985 review finding. It allowed a short note in the materializer docs
    or REGISTRY so that a future default-mode comparison is not mistaken for
    drift. Under the same direction it then directed the materializer fix:
    a whole-file rewrite, in default and --canonical-output mode, must keep
    the local RETIRED rows it dropped, because rows are retired, never
    deleted (docs/SPEC.md section 6.6; dependency-extract). After independent
    review it directed that a local row the aggregate carries as RETIRED be
    written as the aggregate's RETIRED row, that the remaining replacement of
    a local row the aggregate lacks be reported, that Status case be handled
    consistently, and that the four 2026-09-26 dependency follow-up notices
    receive a dated update. This manifest records the gate and grants no
    authority (K-AUTH-1).
  authorized_by: Ryan Tufts (repository owner sgttomas, Claude Code conversation)
  authorization_date: '2026-09-27'
  integration_owner: >-
