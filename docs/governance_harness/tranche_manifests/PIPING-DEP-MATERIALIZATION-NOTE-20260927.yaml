    - projects/chirality-app-dev/execution/_Coordination/NOTICE_2026-09-26_DEPENDENCY_FOLLOWUPS.md
  rationale: >-
    The four loops that received the 2026-09-26 dependency follow-up notice
    each get a dated "Update (2026-09-27)" section appended to it, following
    the ROOT-FOLLOWUPS-WAVE1-20260926 erratum precedent; the original text is
    unchanged. The update states the new behaviour in both modes, that
    Piping's DEL-13-04 RETIRED declared rows are now kept, and that no action
    is required; PEC's is for the record only under D-PEC-62. The change
    brings the tool into line with the existing rule that rows are never
    deleted. No caller relies on the old drop: apart from its tests, the
    tool's only importer is dependency_evidence.py, which uses only its
    _DEPENDENCIES.md section parser and heading keys, and PEC does not use
    the tool. Piping, the only loop that runs it, records the change in the
    same candidate
    (projects/chirality-piping/execution/_Coordination/COORDINATION_RESPONSE_2026-09-27_DEPENDENCY_MATERIALIZATION.md).
    Over Piping's 98 registers the fixed tool keeps all 83 retired rows,
    writes no aggregate RETIRED row in place of a local one, drops no row,
    and both modes give byte-identical output.
scope_limits:
  - >-
    Dependencies.csv rewrite. Each local non-declared row whose DependencyID the output does not carry is kept if RETIRED,
    written as the aggregate's RETIRED row if the aggregate has one, and otherwise replaced (left out) and listed as
    DroppedLocalRows; --canonical-output keeps declared ACTIVE and RETIRED rows. Status is compared trimmed and
    case-insensitively for these decisions.
  - >-
    Exceptions to "nothing else changes": a local column carried only by a kept RETIRED row stays in the output header;
    with --refresh-pointers the generated row counts include the kept and aggregate-RETIRED rows; and a local row the
    aggregate carries as RETIRED is now written as that RETIRED row instead of being left out. Aggregate row content,
    header selection otherwise, aggregate row order and Notes handling are unchanged.
  - The JSON summary adds PreservedRetiredRows, RetiredFromAggregateRows and DroppedLocalRows, and the console adds three lines.
  - The generated _DEPENDENCIES.md register wording is unchanged; the App scaffold copies it byte for byte.
  - No Piping register, DAG version, pointer or scope changes; no release.
