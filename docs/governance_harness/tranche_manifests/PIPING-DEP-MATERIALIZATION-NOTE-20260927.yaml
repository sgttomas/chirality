m6_notice:
  disposition: routed
  routed_to:
    - projects/chirality-piping/execution/_Coordination/NOTICE_2026-09-26_DEPENDENCY_FOLLOWUPS.md
    - projects/pec/execution/_Coordination/NOTICE_2026-09-26_DEPENDENCY_FOLLOWUPS.md
