m2_gate:
  authorization: >-
    Ryan Tufts directed in active chat: 'we need to change the way CI is done
    so there's options depending on what the PR actually entails.' Asked whether
    routing should be automatic or manually selected for each PR, the owner
    selected 'Automatic scoped checks; optional full coverage'. Reuse the
    existing affected-check profile machinery and preserve full coverage for
    product inputs, unknown inputs, policy changes and explicit full requests.
  authorized_by: Ryan Tufts
  authorization_date: 2026-09-23
  integration_owner: HELP_HUMAN /root
  merge_gate: owner-authorized-pr
  self_merge: true
m6_notice:
  disposition: routed
  routed_to:
    - projects/chirality-app-dev/execution/_Coordination/NOTICE_2026-09-23_SCOPED_PR_CI.md
    - projects/chirality-piping/execution/_Coordination/NOTICE_2026-09-23_SCOPED_PR_CI.md
    - projects/chirality-runtime/execution/_Coordination/NOTICE_2026-09-23_SCOPED_PR_CI.md
    - projects/pec/execution/_Coordination/NOTICE_2026-09-23_SCOPED_PR_CI.md
  rationale: >-
    GitHub job routing affects all four project loops. Notices identify the
    scoped product checks and explicit full-run mechanism while preserving
    their local checks, accepted evidence obligations and release boundaries.
scope_limits:
  - CI applicability and coverage selection only; no assertions, thresholds or product tests are weakened.
  - Governance harness remains mandatory; branch protection is unchanged.
  - Skipped/not-applicable jobs supply no product-test pass claim.
  - Existing local project check profiles, DEC-025 sweeps, native witnesses and release gates retain their requirements.
  - PEC loop/work-selection changes and manual updates are outside this tranche.
