m2_gate:
  authorization: >-
    The repository owner directed on 2026-09-26 that the deferred item "needs
    your attention": register the software-prd workflow draft held at
    plans/proposals/Software_PRD_Workflow_Draft_v1/. This is the separate
    library-maintenance authority the draft's README required before a bundled
    registration. The owner then decided on 2026-09-26: "You don't need to
    call those two workflows "unproven" they can become core", and "A, B, C
    and E all as recommended". The adopted C decisions for software-prd are:
    place it in the catalog's core navigation next to software-decomp (core
    navigation only, not a central workflow and not added to the Root
    AGENTS.md table); limit compatible roles to HELP_HUMAN, HELPS_HUMANS and
    WORKING_ITEMS, excluding TASK; name software-prd in software-decomp's
    contract Inputs as a producer of accepted PRDs alongside
    reverse-engineer-software; confirm the default locations RUN_ROOT =
    {WORKING_ROOT}/planning/prd/<run-id>/ and PRD_TARGET = docs/PRD.md; and
    record checkpoint A as a note in PRD_RECORD.md with no required snapshot,
    so that only checkpoint B is always snapshotted. The tranche revises the
    draft to current workflow conventions, registers it in Root's bundled
    catalog with an execution.json, updates the index builder's fixed core
    navigation list and its test, cross-references reverse-engineer-software,
    makes the one-line software-decomp Inputs edit, and updates the agent
    manual's statement that no software-prd is registered.
  authorized_by: Ryan Tufts (repository owner sgttomas, current Claude Code conversation)
  authorization_date: '2026-09-26'
  integration_owner: >-
