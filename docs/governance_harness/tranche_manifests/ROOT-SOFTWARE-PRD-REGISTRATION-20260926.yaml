  - Add execution.json limiting compatible roles to HELP_HUMAN, HELPS_HUMANS and WORKING_ITEMS, with no tool restrictions and no helper tools.
  - Update the fixed core navigation list in tools/validation/build_workflow_index.py and the catalog test, without changing the central set.
  - Add a one-paragraph cross-reference to reverse-engineer-software, and a minimal edit to software-decomp's contract Inputs naming software-prd as a producer of accepted PRDs.
  - Leave the draft under plans/proposals/ in place as history, adding only a registration note to its README.
  - Update the agent manual v3 formation paragraph, navigation row and link references minimally, and regenerate its HTML with the recorded basis.
  - Do not execute software-prd, create or accept a PRD, run decomposition, or release a product.
