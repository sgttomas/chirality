  rationale: >-
    The App bundles the Root workflow library and shows core navigation; its
    authority corpus and _REFERENCES rows pin software-decomp files, so the
    one-line software-decomp contract edit drifts those pins. Runtime owns
    the effective catalog and packaging path. Piping and PEC are software
    loops that form and revise PRDs and consume software-decomp. PEC is being
    redeveloped and the owner is deferring action there; its notice is
    recorded without requesting adoption. Each receiving loop retains its own
    adoption and pin decisions.
scope_limits:
