  rationale: >-
    The change is inside App-owned surfaces: the App SPEC §5.2 paragraph on
    the App's own dependency reads, App frontend source and tests, and App
    run records. It adopts for the App dependency read the execution-root
    rule the Root checker tools/validation/check_amendment_reopen.py and the
