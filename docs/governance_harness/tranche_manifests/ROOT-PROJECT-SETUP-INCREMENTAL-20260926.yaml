m2_gate:
  authorization: >-
    The repository owner directed on 2026-09-26 that the deferred item "needs
    your attention": an incremental project-setup after a scope change. The
    earlier workflow evaluation found no incremental or post-SCA setup mode,
    project-setup Functions 1 and 2 stated as one-time, project-setup deferring
    an active SCA to scope-change, and scope-change handing ADD back through
    project-setup, so the two workflows pointed at each other and setup of
    amended scope had no defined method. On the tranche's open questions the
    owner then directed, on 2026-09-26, "A, B, C and E all as recommended",
    applied here as: (1) scaffolding of added scope happens after acceptance,
    with audit-scope-closure named as the post-acceptance closure check;
    (2) a bounded scope-of-work MODE=REVISE for an existing SOW_V1 deliverable
    whose scope an accepted amendment changes (MODIFY), revising only the named
    parts, preserving identities and unaffected content, recording the
    amendment reference, ending with VERIFY, never changing lifecycle state and
    holding CHECKING or ISSUED deliverables for the human, with project-setup
    INCREMENTAL MODIFY routed to it; (3) the setup log moved out of the
    human-owned _COORDINATION.md into the agent-owned, append-only
    execution/_Coordination/SETUP_LOG.md; (4) DOMAIN additions dispatched to
    domain-documents in its SCA_DRIVEN mode as the amendment's hand-off, with
    domain-documents noting that dispatch; (5) one adoption baseline line in
    SETUP_LOG.md stating that amendments accepted up to that date are already
    set up, older amendments never reprocessed; and (6, E1) ISSUED ->
    IN_PROGRESS authorized only by an accepted amendment (checkpoint group 3
    accepted) whose accepted action register names the deliverable with
    MODIFY or scope-changing RECLASSIFY, recorded by the human citing the
    accepted snapshot at the incremental MODIFY routing, written into
    scope-change and SPEC section 3.3 and recorded as D-GOV-50, with tool
    enforcement left as a follow-up.
  authorized_by: Ryan Tufts (repository owner sgttomas, current Claude Code conversation)
  authorization_date: '2026-09-26'
  integration_owner: >-
    Claude Code parent session integrating on branch claude/brave-goodall-wj3hok
    under the standing Git authorization of 2026-09-12
  merge_gate: owner-authorized-pr
  self_merge: true
m6_notice:
  disposition: routed
  routed_to:
    - projects/chirality-app-dev/execution/_Coordination/NOTICE_2026-09-26_PROJECT_SETUP_INCREMENTAL.md
    - projects/chirality-runtime/execution/_Coordination/NOTICE_2026-09-26_PROJECT_SETUP_INCREMENTAL.md
    - projects/chirality-piping/execution/_Coordination/NOTICE_2026-09-26_PROJECT_SETUP_INCREMENTAL.md
    - projects/pec/execution/_Coordination/NOTICE_2026-09-26_PROJECT_SETUP_INCREMENTAL.md
  rationale: >-
    App, Runtime, Piping and PEC use project-setup, scope-change and
    scope-of-work for their workspaces and amendments, and follow the SPEC
    lifecycle table. The App notice also answers its DEL-07-04 REQ-004
    question about which scope-change record authorizes reopening an ISSUED
    deliverable. PEC is being redeveloped and the owner is deferring action
    there; its notice is for the record.
scope_limits:
  - SPEC changes only in section 3.3 (transition row and the reopening rule), one pointer in section 3.4, and one sentence in section 13 naming the agent-owned, append-only SETUP_LOG.md in the coordination root; TYPES and DECOMPOSITION_STANDARD are unchanged; dependency tracking modes are cited from SPEC section 5.3 and the accepted project DAG, its currency audit and DAG pending from SPEC section 5.4 (D-GOV-49), not restated.
  - No tool changes. tools/scaffolding/write_status.sh and the App's lifecycle transition.ts still refuse ISSUED -> IN_PROGRESS until they implement a check of the amendment record; that is a follow-up.
  - No validator or test enforced the scope-of-work MODE enum; REVISE is documented in the package and guarded by a text test in test_workflow_catalog.py.
  - project-dag and its currency rules are unchanged; incremental setup hands an accepted project DAG to project-dag for a currency audit and reports DAG pending deliverables, but never edits, re-accepts or clears the flag on a DAG version.
  - audit-scope-closure is unchanged; its existing ADD checks are the post-acceptance closure check after incremental setup.
  - Existing _COORDINATION.md files, accepted SCA snapshots, _STATUS.md records and historical run records are not rewritten; no SETUP_LOG.md is created by this tranche.
  - In the decisions register the D-GOV-50 row is added and D-GOV-49's publication SHA (0583e36ff7daca09a7f16f83d60d53392af12f7a, merge of PR #949) is recorded under K-AUTH-2; other rows are unchanged, and D-GOV-50's own publication SHA is left for the next register touch.
  - The adoption baseline of decision (5) is applied so that it never covers an amendment whose Handoff_State.md hands setup to project-setup INCREMENTAL; INITIAL setup records it with latest none on completion, so a project set up after this tranche needs no retroactive baseline.
  - The alignment manual does not describe project-setup as one-time or the SCA hand-back and is unchanged.
  - No release is granted.
