m6_notice:
  disposition: none-required
  routed_to: []
  rationale: >-
    The changes adopt Root notices inside App-owned surfaces (the App SPEC,
    frontend scaffold and lifecycle transition code). No Root instruction,
    role, skill, workflow or tool changes, and no other loop pins the App
    SPEC. The Root SPEC §3.3 and scope-change wording of the ISSUED rule is
    written by a separate Root branch with its own manifest, as are the
    D-GOV-49 and dependency follow-up rules the App SPEC §5.2 now restates. The
    App authority
    corpus already reported drift for the App SPEC before this change; that
    drift is retained, not repinned.
scope_limits:
  - App SPEC §5.2 restates Root SPEC §5.2-5.4 (the union recorded register, the no-accepted-DAG/accepted-DAG blocker split of D-GOV-49 and the Register line) and the §13 coordination-representation wording for App surfaces, and states that the App's CSV-only dependency reads are not a blocker judgment; §4.3 records the evidence the status-transition tools require for the human-ruled CHECKING -> IN_PROGRESS reversal and the optional ruling on the forward human gates, states plainly that the actor is caller-asserted and that the App does not verify the ruling is committed or the SHA names a real commit, states the owner-decided authorizing record for ISSUED -> IN_PROGRESS (MODIFY, or scope-changing RECLASSIFY, per D-GOV-50), and records that the tools reject ISSUED -> IN_PROGRESS until they check that amendment record. No other SPEC section changes.
  - The transition tools reject reserved (Current State, Last Updated, History) and malformed status-field keys, multi-line or control-character field values, and ruling references containing semicolons; they require a non-empty ruling file other than the deliverable's own _STATUS.md; the reversal removes the Checking Approval SHA field. They do not check that the ruling is git-tracked or that the SHA is reachable, unlike write_status.sh.
  - No lifecycle transition, approval-SHA refresh, dependency acceptance, authority-corpus repin, UI change, Runtime change, release or issuance.
  - No amendment-record check, App blocker computation from the recorded register, Runtime descriptor, UI reversal input or SOW verification-sentence change; these are App-loop follow-ups.
  - The App's bundled dependency-extract, project-setup and review workflows are not changed here; when they pick up the dependency follow-up revision is left to this loop.
  - APP_HOLD_REGISTER.csv is unchanged; its schema admits no known-limit row.
  - Existing _DEPENDENCIES.md files and historical records are not rewritten.
