  routed_to:
    - projects/chirality-app-dev/execution/_Coordination/NOTICE_2026-09-26_WORKFLOW_DUPLICATE_RETIREMENT.md
  rationale: >-
    The App's Workflows panel lists bundled workflow packages and hides skill
    browsing in v3.0.0, so these six methods leave that panel while remaining
    available as bundled skills. Runtime resolution already maps the legacy
    names to the skills through the unchanged legacy-method ledger.
scope_limits:
  - Retires only the six workflow packages; the canonical skills remain and carry the methods.
  - Before retirement, execution-critical content missing from the skills was ported (exact _STATUS.md form, scaffold tool operations, research packet command and return fields, diagnosis and consistency write limits, blocking labels for review findings).
  - The legacy-method ledger format and Runtime parsers are unchanged; last revisions are recorded in workflows/README.md.
  - drawing-titleblock-page, superseded packages, and all other workflows are unchanged apart from one link repair.
  - Historical run evidence and pinned identities are not rewritten.
