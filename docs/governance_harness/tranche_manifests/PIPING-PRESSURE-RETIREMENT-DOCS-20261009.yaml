  rationale: >-
    No project loop pins or mirrors the changed texts. Searched at main
    7b2715cb0e, which equals #1168 for these three files: (1) every tracked
    path outside projects/chirality-piping that names piping's docs/TYPES.md,
    SPEC.md, VALIDATION_STRATEGY.md, INTENT.md or PRD.md; (2) the five files'
    SHA-256 and Git blob hashes across the whole tree; (3) the changed
    sentences' own wording across the tree; (4) the App, App v4, Runtime and
    PEC loops' LOOP_INIT, AGENTS.md, instructions and accepted-basis records;
    (5) inside Piping, its LOOP_INIT (whose basis is docs/PRD.md, unchanged
    here), its AGENTS.md, its coordination and decomposition pointers, and
    the T3 and T4 undertakings' rulings, plans and briefs. Hits are history
    only: earlier tranche manifests; agent run records and the 2026-09-21
    deliverable reconciliation snapshot, which pin the old bytes as captured
    evidence; a 2026-07-28 evaluation script; the 2026-09-05 physics audit's
    authority bindings; two dated surveys
    (plans/chirality_piping_solver_maturity_survey_2026-07-31.html and
    Piping's plans/ASSESSMENT_2026-07-09_physical_model_evaluation.md); and
    the 2026-09-22 manual v7 source record, which inspected TYPES.md for
    checking candidacy, not for pressure. Piping's own DAG and deliverable
    dependency rows name the documents by identity (OPS-TYPES, OPS-SPEC,
    OPS-VALIDATION-STRATEGY), not by content. Piping's validation-planning
    inventory (validation/qualification/capability_inventory.json) binds
    VALIDATION_STRATEGY.md's old hash to revision eec2855d82 and checks it
    at that revision only, so it is unaffected. Piping owns these documents,
    and its loop instructions do not bind through them. T4 (pressure
    stress), which may later add pressure capability, cites none of them.
scope_limits:
  - >-
    Five capability statements change, in three documents. Each describes
    an implemented slice or suite as having a pressure capability it no
    longer has: TYPES.md StressRecovery and StressRecoveryBenchmark;
    SPEC.md section 6, the stress recovery slice and its benchmark suite;
    and VALIDATION_STRATEGY.md section 2, the DEL-09-02 suite paragraph,
    which keeps the pressure membrane family as required and states that
    it has no fixture.
  - >-
    Requirement and intent statements are unchanged: PRD.md (the piping
    loop's basis, amended only through its own decision and scope-change
    instruments), INTENT.md, SPEC.md section 6's "shall calculate" sentence
    and VALIDATION_STRATEGY.md section 2's benchmark-family table. They
    state what the product is to do, not what it does now.
  - >-
    The exact straight-pressure contract's standing is not restated: the
    corrected text says only that pressure is solved through that contract,
    within its own qualifications. Planned T4 capability is not anticipated.
  - >-
    No product source, test, fixture, schema, register, decomposition, DAG,
    decision record or loop instruction changes. No release, lifecycle
    promotion, governed acceptance or professional claim follows.
