m2_gate:
  authorization: >-
    The repository owner asked, of the D-GOV-47 IN-only ruling, '"Old wording"
    ?  Why does every scope item NOT get a package, such that you think the
    docs need to be updated?' The agent identified its framing error (the
    management manual v7 and Field Book already give every scope item one
    Package home) and proposed restoring the every-item rule, with IN items
    also mapping to Deliverables, OUT and TBD items keeping a Package home for
    traceability with no production mapping, and the validator warning rather
    than erroring on OUT/TBD items without a Package. The owner replied "yes go
    ahead, but PEC is being redeveloped right now so I'm deferring taking
    action on any findings until the dust settles." Recorded as D-GOV-48,
    superseding D-GOV-47 item 1.
