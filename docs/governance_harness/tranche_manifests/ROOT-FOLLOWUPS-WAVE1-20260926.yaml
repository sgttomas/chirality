rationale: >-
  This tranche carries out the owner-approved plan above and adds no
  governance meaning, so no D-GOV record is made. (1) The brief-field table in
  tools/evaluation/README.md gains the INCLUDE_DECLARED row, matching the
  audit-dep-closure contract (default true, passed as --include-declared). (2)
  analyze_dep_closure.py was read and run on scratch fixtures: it writes
  declared_only.csv, declared_disagreements.csv and declared_unread.csv on every
  run with --output-dir, with headers only under --include-declared false. It
  writes dag_pending.csv only when _DAG/_LATEST.md exists, with headers only
  when the pointer cannot be resolved. (3) software-prd and
  reverse-engineer-software now say they supply the same basis-identity fields
  that software-decomp group 1 consumes, as their contract's "Handoff to
  software-decomp" maps them. Root execution/_Coordination/LOOP_INIT.md
  already named chirality-change for Git closeout in its map. Its protocol
  line still said "the change workflow", and now names the chirality-change
  skill. The project loops' LOOP_INIT files name neither and are unchanged.
  (4) validate_scc_resolution_case.py recognizes a case under
  {EXECUTION_ROOT}/_DAG/cases/ whatever the execution root is named. For such
  a case it adds these checks: the folder sits directly under _DAG/cases/; its
  name has the SCC-CASE-NNN form; Case_Datasheet.md records that ID; no other
  folder there uses the same number; no Dependencies.csv exists anywhere under
  _DAG/cases/; _DAG/cases/_run_records/ does not exist; and the project holds
  no cases in a legacy PKG-00 home. The shared content checks run in both
  homes. Any other case path takes the unchanged legacy path, including the
  PKG-00 Dependencies.csv check, and its errors and messages are the same as
  before. The new test_validate_scc_resolution_case.py runs in CI's pytest
  step over tools/. It covers both homes and re-validates the App's existing
  legacy cases. The scc-resolution-case checks resource no longer calls the
  _DAG/cases/ register check manual and lists what the validator covers.
  tools/REGISTRY.md does not document this validator and is unchanged. The
  workflow index was rebuilt and is unchanged. The public export manifest and
  report were regenerated.
scope_limits:
  - The delivered notices' earlier text is not rewritten; only the dated erratum is appended.
  - D-GOV-49's record, which says the validator checks only the legacy path, is historical and is not edited.
  - Existing SCC cases are not moved, renamed or rewritten, and no case is created under any _DAG/cases/.
  - The originating snapshot, SCC ID and member-node-set records in a case datasheet remain a manual check.
  - Project loops' own LOOP_INIT files and App-owned surfaces are not changed.
  - No release is granted.
