    PEC changes only its own loop instructions. Root owns the shared method
    texts (SPEC section 9.8, PRD_ROOT E-1, the 2026-09-22 amendment record and
    the bundled graph workflow), which name only App and Piping, and its
    alignment manual still describes PEC's loop as Remaining-based; App and
    Piping run the
    method PEC now mirrors; the Root tranches that published the method also
    notified Runtime. Each notice is non-binding and asks for no write.
supersession:
  D-PEC-80: >-
    Not edited. Item A (loop home projects/pec/loop/, Task Management and
    AgentRuns homes) stands. Item B's generic instruction surface is replaced
    by the evergreen LOOP_INIT; its fence text, checks, evidence contract and
    historical mapping move to projects/pec/AGENTS.md. Item C's per-iteration
    commit and receipt with one PR at terminus is replaced by the work graph's
    PR sequence and one central receipt per undertaking. Item D's workplan
    retirement and owner-intent record stand; its selection only from
    deliverable Remaining surfaces is replaced by steering-selected
    undertakings and work graphs, and its former Step 0 mechanical plan check
    is retired while the no-plan rule stands. The per-loop receipt ledger
    closes at Receipt 197; its v2 receipt contract and validator keep
    protecting it.
  D-PEC-88: >-
    Item 6 leaves to this migration whether the standing STATUS/README
    maintenance carries into the migrated loop; D-PEC-94 must record that
    disposition. While D-PEC-88 applies, its trace clause (item 4) is met by
    naming each STATUS/README change in the undertaking's work graph and
    central receipt and reviewing it with the carrying PR.
  D-GOV-20: >-
    PEC AGENTS.md Shared Runtime Boundary now records that D-GOV-43, whose
    topology A2 the App MVP Codex path uses, supersedes D-GOV-20 items 2-4 on
    that path.
