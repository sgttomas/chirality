rollback: >-
  Revert this tranche's commits. LOOP_INIT.md and AGENTS.md return to their
  preimages; Receipt 197 is removed from the end of LOOP_RECEIPTS.md, which
  restores the ledger to its Receipt-196 bytes and leaves the validator VALID;
  the four notices and this manifest are deleted. PEC then runs its
  D-PEC-80 loop with Remaining-based selection. No product, decomposition,
  register, lifecycle or data state changes, so nothing else needs undoing.
