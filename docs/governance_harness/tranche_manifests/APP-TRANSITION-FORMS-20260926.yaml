scope_limits:
  - The Workbench and Pipeline lifecycle transition forms offer the CHECKING -> IN_PROGRESS reversal with a required ruling and the ISSUED -> IN_PROGRESS reopening with a required amendment, take an optional ruling on the gates into CHECKING and ISSUED, send only the inputs shown, show the API refusal code and message (with the amendment checker code) as an alert, and state briefly that the actor is caller-asserted and write_status.sh is the anchored check. The API, validator and MCP tool are unchanged apart from the post-write check.
  - D-APP-36 evidence is component render tests, full-surface interaction tests and a static browser layout check (headless Chromium, the App stylesheet, screenshots hashed in the run's render/MANIFEST.json). The forms are not mounted in the live App, so there is no in-App or packaged render and no human visual check; the FU3 D-APP-36 item stays open for the App loop.
  - applyLifecycleTransition refuses a result that does not parse as the target state, the transition date and exactly one new history entry (INVALID_STATUS_FORMAT), which covers a header line break the writer does not split on (a lone CR, U+2028 or U+2029) and a table-format history row that cannot be written as a table row. App SPEC §4.3 states it.
  - Record corrections to the 3a run (receipt status-file counts and in-place writer limits; the 3a manifest capitalization) change no behaviour.
  - The new deps_read description test fails on this basis by design and passes once FU2 and PR 972 are integrated.
  - No lifecycle transition, approval-SHA refresh, authority-corpus repin, Runtime change, release or issuance.
