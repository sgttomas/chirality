m2_gate:
  authorization: >-
    The repository owner, shown the three dependency follow-ups left open by
    D-GOV-46 (the materializer's --refresh-pointers overwriting human-owned
    _DEPENDENCIES.md sections; declarations recorded only in _DEPENDENCIES.md
    never reaching Dependencies.csv; review Gate 2 item 5 assuming CSV columns
    and not naming FULL_GRAPH), directed "Fix these appropriately." After
    D-GOV-49 was drafted, the owner was shown recommendations on how the
    branch sits with it and decided on 2026-09-26: "A, B, C and E all as
    recommended". Decision B, as recommended: (1) a project without an
    accepted project DAG reads blockers from the union of the declared
    sections and Dependencies.csv, the same edge counting once and the
    declaration governing a disagreement, while a project with an accepted DAG
    reads them from the accepted current version with DAG pending under SPEC
    section 5.4, stated in SPEC section 5.3, project-setup and the review item;
    (2) a mirrored row's DependencyType comes from its section heading
    (upstream PREREQUISITE, downstream ENABLES) and dependency-extract says so;
    (3) materialize_local_dependencies.py keeps Origin=DECLARED rows when it
    rewrites Dependencies.csv from the aggregate graph, with a test;
    (4) build_dev001_blocker_queue.py and analyze_dep_closure.py implement
    that rule, a union reader without an accepted DAG and, with one, the
    version named by _DAG/_LATEST.md with DAG pending on departure, keeping
    their existing behaviour for current inputs, with tests; (5) when an
    existing _DEPENDENCIES.md lacks a human-owned section, the materializer
    and dependency-extract add it as a TBD placeholder and never fill it, and
    SPEC section 5.2 says so, with a test.
  authorized_by: Ryan Tufts (repository owner sgttomas, current Claude Code conversation)
  authorization_date: '2026-09-26'
  integration_owner: >-
    The Claude Code parent session integrating on branch
    claude/brave-goodall-wj3hok under the standing Git authorization of
