  rationale: >-
    The same four loops that received the D-GOV-46 and D-GOV-49 notices hold
    _DEPENDENCIES.md files and use project-setup, dependency-extract and
    review. The App mirrors SPEC section 5 in its own docs and has no _DAG/.
    Runtime records mode DECLARED and has no _DAG/, so the union rule governs
    its blocker reports. Piping has an accepted DAG pointer, has used the
    materializer and blocker queue, and keeps their DAG-file behaviour. PEC is
    being redeveloped and the owner is deferring action there; its notice is
    routed for the record only.
rationale: >-
  This tranche applies D-GOV-46 and D-GOV-49 and the owner's decision recorded
  above; it adds no governance meaning beyond them, so no new D-GOV record is
  made. (1) SPEC section 5.3 defines the recorded register as the union of the
  declared entries and the CSV rows, and states it as the no-accepted-DAG case,
  consistent with section 5.4; the earlier text assumed a mirroring step
  dependency-extract did not have. project-setup and review Gate 2 item 5
  state both cases. (2) dependency-extract mirrors declarations as
  Origin=DECLARED rows whose DependencyType the heading supplies. (3) The
  materializer obeys SPEC section 5.1: it writes only agent-owned sections,
  keeps local Origin=DECLARED rows, adds missing human-owned sections as TBD
  placeholders only, and states the D-GOV-49 authority reading. (4) A shared
  reader (dependency_evidence.py) gives the blocker queue and closure tool the
  union and an arc-and-inventory departure check against the accepted
  version; the project-dag currency audit governs where they differ. The
  blocker queue's DEV-001 DAG-file behaviour is unchanged and the new rule sits
  behind --execution-root; the closure tool reads the union by default, with
  --include-declared false for the earlier CSV-only reading. (5) SPEC section
  5.2 and the preparation scaffold's Register line name both sources.
  (6) As a consequential alignment with D-GOV-49 made in the integrating
  session's brief, audit_dag.py's markdown report names the edge file it
  audited and gives the D-GOV-49 reading; project-dag's graph-version and contract notes about
  that report are updated, on their D-GOV-49 wording as merged. (7) The
  tranche is rebased onto the incremental project-setup and D-GOV-50 basis.
  project-setup Phase 3.1 and Phase 5.6 read blockers by the same two cases,
  and Phase 3.2's advisory section gains a DAG PENDING group so that the
  pending deliverables Phase 3.1 and Phase 5.7 name have a place in the
  report. The workflow index was rebuilt and is unchanged, because no
  package metadata changed; the public export manifest and report were
  regenerated.
scope_limits:
  - No existing _DEPENDENCIES.md, Dependencies.csv, DAG version, pointer, generated report or historical run record is changed or regenerated; no tool was run to write project files.
  - The Dependencies.csv v3.1 schema (SPEC section 6), the section 5.2 headings and the section 5.3 mode vocabulary are unchanged.
  - The tools' departure check compares arcs and inventory only. It does not verify source hashes, re-apply a version's selection rules or read rejection records, so a rejected departure still shows as DAG pending there; the project-dag currency audit governs.
  - The declared-entry reader accepts only the SPEC section 5.2 entry form (and the legacy combined upstream/downstream labels); other lines naming a deliverable are reported as unread, never inferred.
  - App-owned surfaces (projects/chirality-app-dev/docs/SPEC.md) and project loops' own wording are left to their loops through the notices.
  - No release is granted.
