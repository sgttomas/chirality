scope_limits:
  - Removes WorkbenchSurface, PipelineSurface and LifecycleGateFields, their three test files, their tertiary sidebar tab entries, the form-only CSS rules and the form-only client helpers in deliverable-api.ts. None was mounted in the live App.
  - Keeps the deliverable HTTP API routes, the client fetch functions fetchDeliverableStatus, fetchDeliverableDependencies and transitionDeliverableStatus (now without a product caller), deliverable-contracts.ts, lib/lifecycle, lib/dependencies, lib/workspace/task-scope.ts, the MCP tools, and the rest of the legacy LoopTertiaryShell tree and legacy prop wiring.
  - Updates verification hooks only in DEL-07-04, DEL-02-02 and DEL-08-03. Their requirement and obligation text, the v3.2 decomposition note and PRD §8.2 are not changed; where they still require the forms' code or tests, the run receipt holds merge until the owner chooses the owning route.
  - The APP-TRANSITION-FORMS receipt gains a dated note; its render evidence is unchanged.
  - No lifecycle transition, approval-SHA refresh, dependency change, route removal, authority-corpus repin, Runtime change, release or issuance.
