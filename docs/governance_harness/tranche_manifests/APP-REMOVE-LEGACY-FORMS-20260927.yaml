m6_notice:
  disposition: routed
  routed_to:
    - projects/chirality-runtime/execution/_Coordination/NOTICE_2026-09-27_APP_SCA-APP-011_SCAFFOLD_API.md
  rationale: >-
    The change removes App-owned surfaces only: App frontend source, CSS and
    tests, App run records, deliverable MEMORY rows and a DEL-03-03 working
    index. No Root instruction, role, skill, workflow or tool changes, and the
    App SPEC is not changed here. The App stops calling the Runtime's scaffold
    API; the Runtime keeps it. SCA-APP-011 drafts an informational notice to
    the Runtime loop (DRAFT_NOTICE_TO_RUNTIME.md); the scope-change side sent
    it after group-3 acceptance, at the routed path.
scope_limits:
  - Removes WorkbenchSurface, PipelineSurface and LifecycleGateFields, their three test files, their tertiary sidebar tab entries and the form-only CSS rules. None was mounted in the live App.
  - Removes the working-root deliverable status, status/transition and dependencies routes, lib/workspace/deliverable-api.ts and its test, the POST /api/harness/scaffold route and its test, scaffoldHarnessExecutionRoot, and the scaffold member of the App DaemonHarnessPort and RuntimeDaemonHarnessPort with their test stubs.
  - Splits the working-root route test into the library test __tests__/lib/deliverable-contracts.test.ts and the content-route test __tests__/api/working-root/deliverable-content-route.test.ts; only the two request-body parsing rows (INVALID_REQUEST) retire with the routes.
  - Keeps the content route, deliverable-contracts.ts, filesystem.ts, lib/lifecycle, lib/dependencies, the scaffold library, the MCP tools, task-scope.ts, pipeline-dispatch-contract.ts, the loop-first shell and the /workbench and /pipeline URLs.
  - Writes no App SPEC, PRD, PLAN, decomposition, Scope of Work or _CONTEXT.md byte; those SCA-APP-011 edits are its scope-text side.
  - No lifecycle transition, approval-SHA refresh, dependency-register change, authority-corpus repin, Runtime change, release or issuance.
