<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="660" viewBox="0 0 1620 660" role="img" aria-labelledby="title desc">
  <title id="title">Chirality Workroom and Agent Room concept comparison</title>
  <desc id="desc">Three comparable interface wireframes: Workroom First, Agent Room First, and a Workroom-default Hybrid.</desc>
  <defs>
    <style>
      .bg { fill: #f3f1eb; }
      .frame { fill: #fbfaf7; stroke: #cdc9bf; stroke-width: 1.5; }
      .bar { fill: #ffffff; stroke: #dedad1; stroke-width: 1; }
      .nav { fill: #f0f4f1; stroke: #d5ddd7; stroke-width: 1; }
      .canvas { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1; }
      .agent { fill: #eef2f7; stroke: #cdd6e2; stroke-width: 1; }
      .inspect { fill: #f7f4ed; stroke: #ddd5c6; stroke-width: 1; }
      .shelf { fill: #e9e6de; stroke: #d2cec4; stroke-width: 1; }
      .accent { fill: #1f6f5f; }
      .accent2 { fill: #486a91; }
      .accent3 { fill: #9a6a31; }
      .ink { fill: #252b29; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #66706b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #5a625e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: .08em; }
      .title { font-size: 22px; font-weight: 650; }
      .subtitle { font-size: 13px; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .tab { fill: #f3f1eb; stroke: #d5d0c6; stroke-width: 1; }
      .tabactive { fill: #dfece8; stroke: #93b7ab; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #cbd4df; stroke-width: 1; }
      .line { stroke: #8191a3; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1620" height="660"/>
  <text class="ink title" x="42" y="44">Chirality workspace direction</text>
  <text class="muted subtitle" x="42" y="68">Comparable spatial concepts within the accepted SCA-APP-004 Gate-2 envelope</text>

  <!-- Concept A -->
  <g transform="translate(40 100)">
    <rect class="frame" rx="14" width="490" height="510"/>
    <text class="ink title" x="22" y="36">A · Workroom first</text>
    <text class="muted subtitle" x="22" y="58">Artifacts dominate; Agent Room is deliberate.</text>
    <rect class="bar" x="18" y="78" rx="7" width="454" height="44"/>
    <circle class="accent" cx="37" cy="100" r="7"/>
    <text class="ink small" x="51" y="104">Project / Breadcrumb</text>
    <rect class="tabactive" x="284" y="88" rx="6" width="75" height="24"/>
    <text class="ink tiny" x="298" y="104">Workroom</text>
    <rect class="tab" x="365" y="88" rx="6" width="88" height="24"/>
    <text class="muted tiny" x="379" y="104">Agent Room</text>
    <rect class="nav" x="18" y="134" rx="7" width="108" height="272"/>
    <text class="label" x="31" y="158">NAVIGATOR</text>
    <text class="ink small" x="31" y="185">Recent</text>
    <text class="ink small" x="31" y="209">Files</text>
    <text class="ink small" x="31" y="233">Deliverables</text>
    <text class="ink small" x="31" y="257">Changes</text>
    <rect class="canvas" x="136" y="134" rx="7" width="218" height="272"/>
    <rect class="tabactive" x="148" y="146" rx="5" width="70" height="23"/>
    <text class="ink tiny" x="160" y="162">Brief.md</text>
    <rect class="tab" x="223" y="146" rx="5" width="51" height="23"/>
    <text class="muted tiny" x="237" y="162">Diff</text>
    <rect class="tab" x="279" y="146" rx="5" width="62" height="23"/>
    <text class="muted tiny" x="289" y="162">Return</text>
    <text class="label" x="154" y="196">ARTIFACT CANVAS</text>
    <text class="ink small" x="154" y="225">Governed Runtime Contract</text>
    <rect fill="#e6e3db" x="154" y="242" rx="3" width="178" height="7"/>
    <rect fill="#ece9e2" x="154" y="258" rx="3" width="160" height="7"/>
    <rect fill="#ece9e2" x="154" y="274" rx="3" width="171" height="7"/>
    <rect fill="#e3ece8" x="154" y="305" rx="5" width="176" height="64"/>
    <text class="muted tiny" x="165" y="327">Markdown · diff · evidence</text>
    <text class="muted tiny" x="165" y="345">persistent working set</text>
    <rect class="inspect" x="364" y="134" rx="7" width="108" height="272"/>
    <text class="label" x="376" y="158">CONTEXT</text>
    <text class="ink small" x="376" y="186">Metadata</text>
    <text class="ink small" x="376" y="210">Workbench</text>
    <text class="ink small" x="376" y="234">Pipeline</text>
    <text class="ink small" x="376" y="258">Toolkit</text>
    <rect class="shelf" x="18" y="418" rx="7" width="454" height="72"/>
    <text class="label" x="31" y="442">CONVERSATION DOCK</text>
    <text class="ink small" x="31" y="466">Agent working · Open chat</text>
    <rect class="accent" x="382" y="439" rx="5" width="70" height="28"/>
    <text fill="#fff" font-family="-apple-system, sans-serif" font-size="11" x="395" y="457">Interrupt</text>
  </g>

  <!-- Concept B -->
  <g transform="translate(565 100)">
    <rect class="frame" rx="14" width="490" height="510"/>
    <text class="ink title" x="22" y="36">B · Agent Room first</text>
    <text class="muted subtitle" x="22" y="58">Governed sessions are the foyer.</text>
    <rect class="bar" x="18" y="78" rx="7" width="454" height="44"/>
    <circle class="accent2" cx="37" cy="100" r="7"/>
    <text class="ink small" x="51" y="104">Project / Root</text>
    <text class="label" x="250" y="104">ROOM  ARTIFACT  PIPELINE</text>
    <rect class="nav" x="18" y="134" rx="7" width="108" height="272"/>
    <text class="label" x="31" y="158">LIBRARY</text>
    <text class="ink small" x="31" y="185">Files</text>
    <text class="ink small" x="31" y="209">Deliverables</text>
    <text class="ink small" x="31" y="233">Recent</text>
    <rect class="agent" x="136" y="134" rx="7" width="218" height="272"/>
    <text class="label" x="151" y="158">AGENT ROOM</text>
    <rect class="card" x="151" y="178" rx="7" width="188" height="76"/>
    <circle class="accent2" cx="169" cy="198" r="6"/>
    <text class="ink small" x="183" y="202">Agent 1 · running</text>
    <text class="muted tiny" x="169" y="222">Claude · actual model</text>
    <text class="muted tiny" x="169" y="239">Reviewing bounded return</text>
    <path class="line" d="M190 254 L190 275 L209 275"/>
    <rect class="card" x="171" y="275" rx="7" width="168" height="70"/>
    <circle class="accent3" cx="189" cy="295" r="6"/>
    <text class="ink small" x="203" y="299">Agent 2 · complete</text>
    <text class="muted tiny" x="189" y="319">Qwen · one read tool</text>
    <text class="muted tiny" x="189" y="334">Return available</text>
    <text class="muted tiny" x="151" y="375">Recorded relationships only</text>
    <rect class="inspect" x="364" y="134" rx="7" width="108" height="272"/>
    <text class="label" x="376" y="158">EVIDENCE</text>
    <text class="ink small" x="376" y="186">Overview</text>
    <text class="ink small" x="376" y="210">Transcript</text>
    <text class="ink small" x="376" y="234">Tools</text>
    <text class="ink small" x="376" y="258">Return</text>
    <text class="ink small" x="376" y="282">Attribution</text>
    <rect class="shelf" x="18" y="418" rx="7" width="454" height="72"/>
    <text class="label" x="31" y="442">OPERATOR DOCK</text>
    <text class="ink small" x="31" y="466">Mounted chat · persona · toolkit</text>
    <rect class="accent2" x="382" y="439" rx="5" width="70" height="28"/>
    <text fill="#fff" font-family="-apple-system, sans-serif" font-size="11" x="395" y="457">Interrupt</text>
  </g>

  <!-- Concept C -->
  <g transform="translate(1090 100)">
    <rect class="frame" rx="14" width="490" height="510"/>
    <text class="ink title" x="22" y="36">C · Workroom-default hybrid</text>
    <text class="muted subtitle" x="22" y="58">Artifacts first; Agent Room is a full peer.</text>
    <rect class="bar" x="18" y="78" rx="7" width="454" height="44"/>
    <circle class="accent" cx="37" cy="100" r="7"/>
    <text class="ink small" x="51" y="104">Project / Breadcrumb</text>
    <rect class="tabactive" x="284" y="88" rx="6" width="75" height="24"/>
    <text class="ink tiny" x="298" y="104">Workroom</text>
    <rect class="tab" x="365" y="88" rx="6" width="88" height="24"/>
    <text class="muted tiny" x="379" y="104">Agent Room</text>
    <rect class="nav" x="18" y="134" rx="7" width="108" height="272"/>
    <text class="label" x="31" y="158">NAVIGATOR</text>
    <text class="ink small" x="31" y="185">Recent / Pins</text>
    <text class="ink small" x="31" y="209">Files</text>
    <text class="ink small" x="31" y="233">Deliverables</text>
    <text class="ink small" x="31" y="257">Packages</text>
    <rect class="canvas" x="136" y="134" rx="7" width="218" height="272"/>
    <rect class="tabactive" x="148" y="146" rx="5" width="70" height="23"/>
    <text class="ink tiny" x="160" y="162">Brief.md</text>
    <rect class="tab" x="223" y="146" rx="5" width="51" height="23"/>
    <text class="muted tiny" x="237" y="162">Diff</text>
    <rect class="tab" x="279" y="146" rx="5" width="62" height="23"/>
    <text class="muted tiny" x="289" y="162">Return</text>
    <text class="label" x="154" y="196">ARTIFACT CANVAS</text>
    <text class="ink small" x="154" y="225">Workroom is default</text>
    <rect fill="#e6e3db" x="154" y="242" rx="3" width="178" height="7"/>
    <rect fill="#ece9e2" x="154" y="258" rx="3" width="160" height="7"/>
    <rect fill="#ece9e2" x="154" y="274" rx="3" width="171" height="7"/>
    <rect class="agent" x="154" y="305" rx="5" width="176" height="64"/>
    <text class="muted tiny" x="165" y="327">Agent return cross-linked</text>
    <text class="muted tiny" x="165" y="345">to full peer Agent Room</text>
    <rect class="inspect" x="364" y="134" rx="7" width="108" height="272"/>
    <text class="label" x="376" y="158">INSPECTOR</text>
    <text class="ink small" x="376" y="186">Context</text>
    <text class="ink small" x="376" y="210">Related run</text>
    <text class="ink small" x="376" y="234">Ask</text>
    <text class="ink small" x="376" y="258">Run</text>
    <rect class="shelf" x="18" y="418" rx="7" width="454" height="72"/>
    <text class="label" x="31" y="442">SHARED ACTIVITY SHELF</text>
    <text class="ink small" x="31" y="466">Tools · tests · evidence · diagnostics</text>
    <rect class="accent" x="382" y="439" rx="5" width="70" height="28"/>
    <text fill="#fff" font-family="-apple-system, sans-serif" font-size="11" x="399" y="457">Expand</text>
  </g>
</svg>
